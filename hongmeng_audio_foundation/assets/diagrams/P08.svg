<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">第三部分 · 创新一：Buffer与稳定性</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="138.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="700" text-anchor="start">Buffer精简，怎样同时守住抗抖动</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">减少中转环节，同时保留供数、格式适配与设备提交所需的缓存</text><rect x="64" y="249" width="1140" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="283.125" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start">可以减少：随线程交接而存在的中转边界</text><rect x="64" y="312" width="1140" height="43" fill="none" stroke="none" stroke-width="0"/><text x="64" y="344.375" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="start">仍需保留：各层适配与供数职责</text><rect x="64" y="395" width="320" height="86" fill="#12263B" stroke="none" stroke-width="0"/><rect x="76" y="401" width="296" height="74" fill="none" stroke="none" stroke-width="0"/><text x="224" y="431.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="middle">共享音频缓冲</text><text x="224" y="465" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="middle">应用供数</text><rect x="479" y="395" width="320" height="86" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="491" y="401" width="296" height="74" fill="none" stroke="none" stroke-width="0"/><text x="639" y="431.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Converter 缓存</text><text x="639" y="464" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">格式 / 块长适配</text><rect x="894" y="395" width="320" height="86" fill="#119A92" stroke="none" stroke-width="0"/><rect x="906" y="401" width="296" height="74" fill="none" stroke="none" stroke-width="0"/><text x="1054" y="431.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">SinkOutput 缓存</text><text x="1054" y="464" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">凑足提交粒度</text><line x1="396" y1="438" x2="467" y2="438" stroke="#3379EB" stroke-width="3"/><line x1="457.9955289764732" y1="442.3496553411123" x2="467" y2="438" stroke="#3379EB" stroke-width="3"/><line x1="457.9955289764732" y1="433.6503446588877" x2="467" y2="438" stroke="#3379EB" stroke-width="3"/><line x1="811" y1="438" x2="882" y2="438" stroke="#3379EB" stroke-width="3"/><line x1="872.9955289764732" y1="442.3496553411123" x2="882" y2="438" stroke="#3379EB" stroke-width="3"/><line x1="872.9955289764732" y1="433.6503446588877" x2="882" y2="438" stroke="#3379EB" stroke-width="3"/><rect x="64" y="530" width="1140" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="561.875" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="start">“少一些 Buffer”与“少一些抗抖动余量”不能直接等同</text><rect x="64" y="594" width="1140" height="44" fill="none" stroke="none" stroke-width="0"/><text x="64" y="626.875" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="start">团队结论：降低时延，同时保持端到端抗抖动能力</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">缓冲职责示意，省略中间节点；抗抖动保持为团队结论，需同负载与扰动条件验证</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">08</text></svg>