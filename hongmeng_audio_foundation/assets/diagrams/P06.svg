<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">第二部分 · 目标、约束与演进路线</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="138.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="700" text-anchor="start">自研要改变什么，又必须守住什么</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">降低时延与开销，提高扩展性，同时承接完整系统约束</text><rect x="64" y="254" width="540" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="288.5" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" text-anchor="start">要改善的结果</text><rect x="685" y="254" width="529" height="45" fill="none" stroke="none" stroke-width="0"/><text x="685" y="288.5" fill="#887798" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" text-anchor="start">必须守住的约束</text><rect x="64" y="323" width="540" height="114" fill="none" stroke="none" stroke-width="0"/><text x="64" y="353.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="400" text-anchor="start">更低时延与功耗</text><text x="64" y="391.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="400" text-anchor="start">更高处理效率</text><text x="64" y="428.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="400" text-anchor="start">更灵活的通路扩展</text><rect x="685" y="323" width="529" height="114" fill="none" stroke="none" stroke-width="0"/><text x="685" y="353.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="400" text-anchor="start">端到端抗抖动</text><text x="685" y="391.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="400" text-anchor="start">策略规则与流状态一致</text><text x="685" y="428.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="400" text-anchor="start">已有场景和设备能力</text><line x1="629" y1="251" x2="629" y2="467" stroke="#DCE5EE" stroke-width="2"/><line x1="64" y1="496" x2="1214" y2="496" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="537" width="355" height="43" fill="none" stroke="none" stroke-width="0"/><text x="64" y="569.375" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="start">线程与 Buffer 精简</text><rect x="465" y="537" width="355" height="43" fill="none" stroke="none" stroke-width="0"/><text x="465" y="569.375" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="start">无锁消息流转</text><rect x="866" y="537" width="348" height="43" fill="none" stroke="none" stroke-width="0"/><text x="866" y="569.375" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="start">节点职责复用</text><rect x="64" y="597" width="1150" height="41" fill="none" stroke="none" stroke-width="0"/><text x="64" y="627.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">接下来逐项解释：具体改了哪里，为什么有助于全局体验</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">目标与定性收益来自团队说明；量化幅度与测试条件待补，源码用于解释机制</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">06</text></svg>