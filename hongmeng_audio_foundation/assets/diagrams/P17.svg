<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">技术附录 · A2</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="138.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="700" text-anchor="start">A2  无锁队列的常规路径与慢路径</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">原子发布和批次摘取，不等于扩容、通知与任务执行都无锁</text><rect x="64" y="292" width="240" height="87" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="76" y="298" width="216" height="75" fill="none" stroke="none" stroke-width="0"/><text x="184" y="345.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">取得空闲节点</text><rect x="366" y="292" width="240" height="87" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="378" y="298" width="216" height="75" fill="none" stroke="none" stroke-width="0"/><text x="486" y="345.625" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="middle">写入请求</text><rect x="668" y="292" width="240" height="87" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="680" y="298" width="216" height="75" fill="none" stroke="none" stroke-width="0"/><text x="788" y="345.625" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="middle">CAS 发布</text><rect x="970" y="292" width="244" height="87" fill="#119A92" stroke="none" stroke-width="0"/><rect x="982" y="298" width="220" height="75" fill="none" stroke="none" stroke-width="0"/><text x="1092" y="329.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle">原子摘取批次</text><text x="1092" y="359.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle">随后依次执行</text><line x1="316" y1="335" x2="354" y2="335" stroke="#3379EB" stroke-width="3"/><line x1="344.9955289764732" y1="339.3496553411123" x2="354" y2="335" stroke="#3379EB" stroke-width="3"/><line x1="344.9955289764732" y1="330.6503446588877" x2="354" y2="335" stroke="#3379EB" stroke-width="3"/><line x1="618" y1="335" x2="656" y2="335" stroke="#3379EB" stroke-width="3"/><line x1="646.9955289764732" y1="339.3496553411123" x2="656" y2="335" stroke="#3379EB" stroke-width="3"/><line x1="646.9955289764732" y1="330.6503446588877" x2="656" y2="335" stroke="#3379EB" stroke-width="3"/><line x1="920" y1="335" x2="958" y2="335" stroke="#3379EB" stroke-width="3"/><line x1="948.9955289764732" y1="339.3496553411123" x2="958" y2="335" stroke="#3379EB" stroke-width="3"/><line x1="948.9955289764732" y1="330.6503446588877" x2="958" y2="335" stroke="#3379EB" stroke-width="3"/><rect x="64" y="437" width="1150" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="472.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" text-anchor="start">初始 1000  /  90% 阈值扩容  /  上限 5000</text><rect x="64" y="511" width="1150" height="43" fill="none" stroke="none" stroke-width="0"/><text x="64" y="543.75" fill="#887798" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" text-anchor="start">扩容：加锁、分配；耗尽：丢请求并报告</text><rect x="64" y="584" width="1150" height="43" fill="none" stroke="none" stroke-width="0"/><text x="64" y="616.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" text-anchor="start">任务执行、通知、等待和临时容器仍有各自开销</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">数字是当前固定源码队列配置，不是性能指标；批次次序不代表外部业务全局总序</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">A2</text></svg>