<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">技术附录 · A5</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="138.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="700" text-anchor="start">A5  设备切换中的节点与状态衔接</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">引擎迁移已有输入节点，并按目标设备更新格式、标识与连接</text><rect x="64" y="247" width="1150" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="278.5" fill="#887798" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">上层前提：策略选择目标设备，服务协调输出资源和状态</text><rect x="64" y="344" width="240" height="112" fill="#62768A" stroke="none" stroke-width="0"/><rect x="76" y="350" width="216" height="100" fill="none" stroke="none" stroke-width="0"/><text x="184" y="393.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="middle">旧处理图</text><text x="184" y="427" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="middle">拆除连接</text><rect x="366" y="344" width="240" height="112" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="378" y="350" width="216" height="100" fill="none" stroke="none" stroke-width="0"/><text x="486" y="393" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="middle">保留</text><text x="486" y="428" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="middle">SinkInput</text><rect x="668" y="344" width="240" height="112" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="680" y="350" width="216" height="100" fill="none" stroke="none" stroke-width="0"/><text x="788" y="393.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">适配目标</text><text x="788" y="426" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">设备 / span</text><rect x="970" y="344" width="244" height="112" fill="#119A92" stroke="none" stroke-width="0"/><rect x="982" y="350" width="220" height="100" fill="none" stroke="none" stroke-width="0"/><text x="1092" y="393.75" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle">接入新处理簇</text><text x="1092" y="425" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle">按状态重连</text><line x1="316" y1="400" x2="354" y2="400" stroke="#3379EB" stroke-width="3"/><line x1="344.9955289764732" y1="404.3496553411123" x2="354" y2="400" stroke="#3379EB" stroke-width="3"/><line x1="344.9955289764732" y1="395.6503446588877" x2="354" y2="400" stroke="#3379EB" stroke-width="3"/><line x1="618" y1="400" x2="656" y2="400" stroke="#3379EB" stroke-width="3"/><line x1="646.9955289764732" y1="404.3496553411123" x2="656" y2="400" stroke="#3379EB" stroke-width="3"/><line x1="646.9955289764732" y1="395.6503446588877" x2="656" y2="400" stroke="#3379EB" stroke-width="3"/><line x1="920" y1="400" x2="958" y2="400" stroke="#3379EB" stroke-width="3"/><line x1="948.9955289764732" y1="404.3496553411123" x2="958" y2="400" stroke="#3379EB" stroke-width="3"/><line x1="948.9955289764732" y1="395.6503446588877" x2="958" y2="400" stroke="#3379EB" stroke-width="3"/><rect x="64" y="512" width="1150" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="545.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" text-anchor="start">迁移的不只有数据，还有设备身份、音效绑定与会话状态</text><rect x="64" y="586" width="1150" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="617.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">缓存与音效状态按条件保留；管理成功回报还需与真实输出区分</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">已存在目标sink间的可移动路径；非完整蓝牙热插拔时序，不提供无缝切换保证</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">A5</text></svg>