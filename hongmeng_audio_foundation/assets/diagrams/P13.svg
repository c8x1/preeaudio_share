<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">第四部分 · 从机制到系统收益</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="138.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="700" text-anchor="start">收益怎样在整条音频链路上体现</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">机制提供改善路径，系统收益需要在一致的场景和测量边界下观察</text><rect x="64" y="249" width="295" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="280.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">收益维度</text><rect x="380" y="249" width="520" height="42" fill="none" stroke="none" stroke-width="0"/><text x="380" y="280.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">机制怎样起作用</text><rect x="967" y="249" width="247" height="42" fill="none" stroke="none" stroke-width="0"/><text x="967" y="280.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">系统观察</text><rect x="64" y="332" width="280" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="366.125" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start">响应时延</text><rect x="380" y="323" width="539" height="76" fill="none" stroke="none" stroke-width="0"/><text x="380" y="354" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">中转与等待机会减少</text><text x="380" y="389" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">控制流转更顺畅</text><rect x="967" y="323" width="247" height="76" fill="none" stroke="none" stroke-width="0"/><text x="967" y="354.5" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="start">端到端分布</text><text x="967" y="387" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="start">局部耗时</text><line x1="64" y1="416" x2="1214" y2="416" stroke="#DCE5EE" stroke-width="1"/><rect x="64" y="452" width="280" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="486.125" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start">性能与功耗</text><rect x="380" y="443" width="539" height="76" fill="none" stroke="none" stroke-width="0"/><text x="380" y="474" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">同步 / 唤醒 / 调度开销减少</text><text x="380" y="509" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">处理链协同执行</text><rect x="967" y="443" width="247" height="76" fill="none" stroke="none" stroke-width="0"/><text x="967" y="474.5" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="start">CPU / 唤醒</text><text x="967" y="507" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="start">设备能量</text><line x1="64" y1="536" x2="1214" y2="536" stroke="#DCE5EE" stroke-width="1"/><rect x="64" y="572" width="280" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="606.125" fill="#887798" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start">扩展性</text><rect x="380" y="563" width="539" height="76" fill="none" stroke="none" stroke-width="0"/><text x="380" y="594" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">复用节点与职责</text><text x="380" y="629" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">集中局部改动</text><rect x="967" y="563" width="247" height="76" fill="none" stroke="none" stroke-width="0"/><text x="967" y="594.5" fill="#887798" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="start">改动范围</text><text x="967" y="627" fill="#887798" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="start">适配与回归</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">团队定性成果：时延降低、性能提升、功耗降低且保持抗抖动；未给出量化幅度</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">13</text></svg>