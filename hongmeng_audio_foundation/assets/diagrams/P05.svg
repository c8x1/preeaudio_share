<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">第二部分 · 从业务要求定位改进位置</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="138.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="700" text-anchor="start">业务要求提高后，成本出现在哪里</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">更及时的响应、更低开销和更快需求迭代，要求重新审视执行边界</text><rect x="64" y="247" width="405" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="278.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">结构中的成本</text><rect x="552" y="247" width="660" height="42" fill="none" stroke="none" stroke-width="0"/><text x="552" y="278.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">业务上关注什么</text><rect x="64" y="321" width="422" height="46" fill="none" stroke="none" stroke-width="0"/><text x="64" y="355.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start">线程与 Buffer 交接</text><line x1="470" y1="345" x2="525" y2="345" stroke="#3379EB" stroke-width="3"/><line x1="515.9955289764732" y1="349.3496553411123" x2="525" y2="345" stroke="#3379EB" stroke-width="3"/><line x1="515.9955289764732" y1="340.6503446588877" x2="525" y2="345" stroke="#3379EB" stroke-width="3"/><rect x="552" y="312" width="655" height="75" fill="none" stroke="none" stroke-width="0"/><text x="552" y="342.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">排队 / 唤醒 / 调度开销</text><text x="552" y="377.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">响应与资源效率</text><line x1="64" y1="407" x2="1214" y2="407" stroke="#DCE5EE" stroke-width="1"/><rect x="64" y="443" width="422" height="46" fill="none" stroke="none" stroke-width="0"/><text x="64" y="477.625" fill="#887798" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start">控制操作的同步竞争</text><line x1="470" y1="467" x2="525" y2="467" stroke="#887798" stroke-width="3"/><line x1="515.9955289764732" y1="471.3496553411123" x2="525" y2="467" stroke="#887798" stroke-width="3"/><line x1="515.9955289764732" y1="462.6503446588877" x2="525" y2="467" stroke="#887798" stroke-width="3"/><rect x="552" y="434" width="655" height="75" fill="none" stroke="none" stroke-width="0"/><text x="552" y="464.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">状态变化怎样及时进入执行</text><text x="552" y="499.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">消息流转效率</text><line x1="64" y1="529" x2="1214" y2="529" stroke="#DCE5EE" stroke-width="1"/><rect x="64" y="564" width="422" height="46" fill="none" stroke="none" stroke-width="0"/><text x="64" y="598.625" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start">通路专用逻辑的维护</text><line x1="470" y1="588" x2="525" y2="588" stroke="#119A92" stroke-width="3"/><line x1="515.9955289764732" y1="592.3496553411123" x2="525" y2="588" stroke="#119A92" stroke-width="3"/><line x1="515.9955289764732" y1="583.6503446588877" x2="525" y2="588" stroke="#119A92" stroke-width="3"/><rect x="552" y="555" width="655" height="75" fill="none" stroke="none" stroke-width="0"/><text x="552" y="585.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">相似职责怎样复用</text><text x="552" y="620.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">新增能力的扩展成本</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">上屏为源码结构与机制解释，非实测瓶颈排名；具体开销需同场景测量</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">05</text></svg>