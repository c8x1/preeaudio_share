<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">第四部分 · 可执行的验证设计</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="138.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="700" text-anchor="start">用同一个完整场景验证改进</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">固定业务语义与环境，记录配置差异，同时观察效率和连续性</text><rect x="64" y="246" width="1150" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="277.875" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="start">场景脚本：音乐持续 → 游戏加入 → 提醒出现 → 切换耳机</text><rect x="64" y="333" width="520" height="44" fill="none" stroke="none" stroke-width="0"/><text x="64" y="367" fill="#887798" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" text-anchor="start">控制比较条件</text><rect x="64" y="397" width="520" height="143" fill="none" stroke="none" stroke-width="0"/><text x="64" y="444.875" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">同产品 / 同硬件 / 同业务语义</text><text x="64" y="478.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">记录缓冲、线程及音效配置</text><text x="64" y="512.375" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">固定负载、扰动、时长与重复次数</text><rect x="685" y="333" width="529" height="44" fill="none" stroke="none" stroke-width="0"/><text x="685" y="367" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" text-anchor="start">一起观察结果</text><rect x="685" y="397" width="529" height="143" fill="none" stroke="none" stroke-width="0"/><text x="685" y="444.875" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">响应分布与关键阶段耗时</text><text x="685" y="478.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">CPU、线程唤醒与设备能量</text><text x="685" y="512.375" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">欠载、断音、切换与策略行为</text><line x1="629" y1="327" x2="629" y2="563" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="597" width="1150" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="631.125" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start">局部测量解释原因，端到端结果回答体验是否改善</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">验证设计，非已执行实验；团队定性成果已提供，量化数据与产品条件待补</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">14</text></svg>