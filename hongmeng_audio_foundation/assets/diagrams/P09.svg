<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">第三部分 · 创新二：消息流转</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="138.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="700" text-anchor="start">无锁队列：控制请求怎样进入执行侧</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">以启动流为例：原子发布请求，由管理器处理线程消费并更新状态</text><rect x="64" y="247" width="1140" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="278.875" fill="#887798" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="start">5.1 Start 实例：PaLockGuard 保护 PA mainloop 操作</text><rect x="64" y="333" width="258" height="91" fill="#62768A" stroke="none" stroke-width="0"/><rect x="76" y="339" width="234" height="79" fill="none" stroke="none" stroke-width="0"/><text x="193" y="389.375" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="middle">启动请求</text><rect x="399" y="333" width="300" height="91" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="411" y="339" width="276" height="79" fill="none" stroke="none" stroke-width="0"/><text x="549" y="372" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">原子发布</text><text x="549" y="404.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">HpaeNoLockQueue</text><rect x="776" y="333" width="438" height="91" fill="#119A92" stroke="none" stroke-width="0"/><rect x="788" y="339" width="414" height="79" fill="none" stroke="none" stroke-width="0"/><text x="995" y="371.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="middle">处理线程</text><text x="995" y="407.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="middle">HandleMsg 后 Process</text><line x1="334" y1="378" x2="387" y2="378" stroke="#3379EB" stroke-width="3"/><line x1="377.9955289764732" y1="382.3496553411123" x2="387" y2="378" stroke="#3379EB" stroke-width="3"/><line x1="377.9955289764732" y1="373.6503446588877" x2="387" y2="378" stroke="#3379EB" stroke-width="3"/><line x1="711" y1="378" x2="764" y2="378" stroke="#3379EB" stroke-width="3"/><line x1="754.9955289764732" y1="382.3496553411123" x2="764" y2="378" stroke="#3379EB" stroke-width="3"/><line x1="754.9955289764732" y1="373.6503446588877" x2="764" y2="378" stroke="#3379EB" stroke-width="3"/><rect x="64" y="472" width="1150" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="505.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" text-anchor="start">请求执行：更新状态、连接输入、设置淡入与可选音效</text><rect x="64" y="539" width="1150" height="43" fill="none" stroke="none" stroke-width="0"/><text x="64" y="572.125" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start">常规发布 / 摘取减少队列互斥锁竞争</text><rect x="64" y="605" width="1150" height="39" fill="none" stroke="none" stroke-width="0"/><text x="64" y="634.625" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">扩容与通知等待仍有锁；这是一条控制队列</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">对照控制模型而非同一把锁逐行替换；不宣称所有音量/路由操作都走同一队列</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">09</text></svg>