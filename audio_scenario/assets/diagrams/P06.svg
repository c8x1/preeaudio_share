<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">再看这三个操作</text><rect x="64" y="140" width="1140" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="170.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">回到这一路音乐，三个操作分别改变了什么？</text><rect x="64" y="319" width="140" height="45" fill="#119A92" stroke="none" stroke-width="0"/><rect x="76" y="325" width="116" height="33" fill="none" stroke="none" stroke-width="0"/><text x="134" y="350.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle">音乐 A</text><line x1="204" y1="341" x2="280" y2="341" stroke="#119A92" stroke-width="3"/><line x1="270.9955289764732" y1="345.3496553411123" x2="280" y2="341" stroke="#119A92" stroke-width="3"/><line x1="270.9955289764732" y1="336.6503446588877" x2="280" y2="341" stroke="#119A92" stroke-width="3"/><rect x="280" y="307" width="175" height="68" fill="none" stroke="#DCE5EE" stroke-width="2"/><rect x="293" y="329" width="24" height="26" fill="#119A92" stroke="none" stroke-width="0"/><rect x="325" y="329" width="24" height="26" fill="#119A92" stroke="none" stroke-width="0"/><rect x="357" y="329" width="24" height="26" fill="#119A92" stroke="none" stroke-width="0"/><rect x="389" y="329" width="24" height="26" fill="#119A92" stroke="none" stroke-width="0"/><rect x="535" y="307" width="190" height="68" fill="#12263B" stroke="none" stroke-width="0"/><rect x="547" y="313" width="166" height="56" fill="none" stroke="none" stroke-width="0"/><text x="630" y="350.75" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">增益与音效</text><rect x="873" y="307" width="220" height="68" fill="#12263B" stroke="none" stroke-width="0"/><rect x="885" y="313" width="196" height="56" fill="none" stroke="none" stroke-width="0"/><text x="983" y="350.75" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">设备处理链</text><line x1="455" y1="341" x2="535" y2="341" stroke="#119A92" stroke-width="3"/><line x1="525.9955289764732" y1="345.3496553411123" x2="535" y2="341" stroke="#119A92" stroke-width="3"/><line x1="525.9955289764732" y1="336.6503446588877" x2="535" y2="341" stroke="#119A92" stroke-width="3"/><line x1="725" y1="341" x2="873" y2="341" stroke="#119A92" stroke-width="3"/><line x1="863.9955289764732" y1="345.3496553411123" x2="873" y2="341" stroke="#119A92" stroke-width="3"/><line x1="863.9955289764732" y1="336.6503446588877" x2="873" y2="341" stroke="#119A92" stroke-width="3"/><line x1="1093" y1="341" x2="1200" y2="341" stroke="#119A92" stroke-width="3"/><line x1="1190.9955289764732" y1="345.3496553411123" x2="1200" y2="341" stroke="#119A92" stroke-width="3"/><line x1="1190.9955289764732" y1="336.6503446588877" x2="1200" y2="341" stroke="#119A92" stroke-width="3"/><!-- reveal 1 --><rect x="64" y="433" width="300" height="37" fill="none" stroke="none" stroke-width="0"/><text x="64" y="462.375" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="start">暂停</text><rect x="64" y="483" width="325" height="74" fill="none" stroke="none" stroke-width="0"/><text x="64" y="513.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">完成淡出，</text><text x="64" y="547" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">再断开输入。</text><rect x="450" y="433" width="300" height="37" fill="none" stroke="none" stroke-width="0"/><text x="450" y="462.375" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="start">恢复</text><rect x="450" y="483" width="325" height="74" fill="none" stroke="none" stroke-width="0"/><text x="450" y="513.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">执行旧请求前，</text><text x="450" y="547" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">确认是否已恢复。</text><rect x="836" y="433" width="350" height="37" fill="none" stroke="none" stroke-width="0"/><text x="836" y="462.375" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="start">切耳机</text><rect x="836" y="483" width="350" height="74" fill="none" stroke="none" stroke-width="0"/><text x="836" y="513.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">交接同一个会话，</text><text x="836" y="547" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">接入目标设备链。</text><!-- reveal 2 --><line x1="64" y1="590" x2="1214" y2="590" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="608" width="1140" height="44" fill="none" stroke="none" stroke-width="0"/><text x="64" y="640.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">时间、队列、状态、设备差异、耳朵：五样都得交代，这就是复杂性的去处。</text><!-- reveal 0 --><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">下一部分：相同普通输出路径下，对比 PA 与 HPAE 的执行组织。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">06</text></svg>