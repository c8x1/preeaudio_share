<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">这些请求，谁来执行？</text><rect x="64" y="139" width="1140" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="169.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">前面反复出现的“排队”与“等待执行”，载体是一个队列加一条线程。</text><rect x="460" y="225" width="400" height="300" fill="none" stroke="#12263B" stroke-width="2"/><rect x="480" y="238" width="360" height="38" fill="none" stroke="none" stroke-width="0"/><text x="660" y="266.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">信号处理线程</text><rect x="495" y="290" width="330" height="58" fill="#12263B" stroke="none" stroke-width="0"/><rect x="507" y="296" width="306" height="46" fill="none" stroke="none" stroke-width="0"/><text x="660" y="327.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">排空队列，执行控制请求</text><rect x="495" y="362" width="330" height="58" fill="#12263B" stroke="none" stroke-width="0"/><rect x="507" y="368" width="306" height="46" fill="none" stroke="none" stroke-width="0"/><text x="660" y="399.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">跑一轮音频处理</text><line x1="475" y1="391" x2="475" y2="319" stroke="#62768A" stroke-width="3"/><line x1="479.3496553411123" y1="328.0044710235268" x2="475" y2="319" stroke="#62768A" stroke-width="3"/><line x1="470.6503446588877" y1="328.0044710235268" x2="475" y2="319" stroke="#62768A" stroke-width="3"/><rect x="495" y="432" width="330" height="30" fill="none" stroke="none" stroke-width="0"/><text x="660" y="454.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle">睡到下次唤醒，再来一遍</text><!-- reveal 1 --><rect x="64" y="214" width="300" height="35" fill="none" stroke="none" stroke-width="0"/><text x="64" y="240.5" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">控制请求队列</text><rect x="64" y="258" width="300" height="50" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="76" y="264" width="276" height="38" fill="none" stroke="none" stroke-width="0"/><text x="214" y="291.625" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">① 暂停</text><rect x="64" y="318" width="300" height="50" fill="#C97835" stroke="none" stroke-width="0"/><rect x="76" y="324" width="276" height="38" fill="none" stroke="none" stroke-width="0"/><text x="214" y="351.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">② 淡出完成后的收尾</text><rect x="64" y="378" width="300" height="50" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="76" y="384" width="276" height="38" fill="none" stroke="none" stroke-width="0"/><text x="214" y="411.625" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">③ 恢复播放</text><rect x="64" y="438" width="300" height="50" fill="#119A92" stroke="none" stroke-width="0"/><rect x="76" y="444" width="276" height="38" fill="none" stroke="none" stroke-width="0"/><text x="214" y="471.625" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">④ 切到耳机</text><rect x="372" y="266" width="120" height="40" fill="none" stroke="none" stroke-width="0"/><text x="372" y="281.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">下一条</text><text x="372" y="305" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">先执行</text><line x1="364" y1="340" x2="371.5833333333333" y2="340" stroke="#3379EB" stroke-width="2"/><line x1="379.1666666666667" y1="340" x2="386.75" y2="340" stroke="#3379EB" stroke-width="2"/><line x1="394.3333333333333" y1="340" x2="401.9166666666667" y2="340" stroke="#3379EB" stroke-width="2"/><line x1="409.5" y1="340" x2="417.0833333333333" y2="340" stroke="#3379EB" stroke-width="2"/><line x1="424.6666666666667" y1="340" x2="432.25" y2="340" stroke="#3379EB" stroke-width="2"/><line x1="439.8333333333333" y1="340" x2="447.4166666666667" y2="340" stroke="#3379EB" stroke-width="2"/><line x1="445.9955289764732" y1="344.3496553411123" x2="455" y2="340" stroke="#3379EB" stroke-width="3"/><line x1="445.9955289764732" y1="335.6503446588877" x2="455" y2="340" stroke="#3379EB" stroke-width="3"/><!-- reveal 2 --><rect x="900" y="240" width="330" height="150" fill="none" stroke="none" stroke-width="0"/><text x="900" y="294.875" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">改图的人就是跑数据的人：</text><text x="900" y="323.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">同一条线程串行，</text><text x="900" y="352.375" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">这个队列不需要锁。</text><rect x="64" y="555" width="1140" height="60" fill="none" stroke="none" stroke-width="0"/><text x="64" y="594" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">淡出完成不是定时器猜的：处理链在真实数据上跑完渐变，就地发回“淡出完成”，排到队尾。</text><rect x="64" y="618" width="1140" height="36" fill="none" stroke="none" stroke-width="0"/><text x="64" y="645.375" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">短淡出 5 毫秒，默认淡出一轮数据内完成；改图永远不跟数据处理抢线程。</text><!-- reveal 0 --><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">队列与线程为结构示意。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">06</text></svg>