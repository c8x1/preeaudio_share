<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">一首歌，三个操作</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="137.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">音频引擎把用户操作落实到声音处理</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">顺畅的体验，来自控制状态与持续数据处理之间的协调。</text><rect x="64" y="235" width="1140" height="35" fill="none" stroke="none" stroke-width="0"/><text x="64" y="262.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="start">同一个引擎，同时协调控制进度、数据处理和设备连接。</text><rect x="64" y="299" width="350" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="334.25" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" text-anchor="start">暂停</text><line x1="64" y1="360" x2="409" y2="360" stroke="#C97835" stroke-width="4"/><rect x="64" y="382" width="350" height="36" fill="none" stroke="none" stroke-width="0"/><text x="64" y="410.125" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">等待淡出完成</text><rect x="64" y="433" width="345" height="68" fill="none" stroke="none" stroke-width="0"/><text x="64" y="475.625" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">中间状态连接声音变化与收尾动作</text><rect x="450" y="299" width="350" height="45" fill="none" stroke="none" stroke-width="0"/><text x="450" y="334.25" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" text-anchor="start">恢复</text><line x1="450" y1="360" x2="795" y2="360" stroke="#3379EB" stroke-width="4"/><rect x="450" y="382" width="350" height="36" fill="none" stroke="none" stroke-width="0"/><text x="450" y="410.125" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">执行前看当前状态</text><rect x="450" y="433" width="345" height="68" fill="none" stroke="none" stroke-width="0"/><text x="450" y="475.625" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">避免旧的完成通知破坏新播放</text><rect x="836" y="299" width="350" height="45" fill="none" stroke="none" stroke-width="0"/><text x="836" y="334.25" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" text-anchor="start">切换设备</text><line x1="836" y1="360" x2="1181" y2="360" stroke="#119A92" stroke-width="4"/><rect x="836" y="382" width="350" height="36" fill="none" stroke="none" stroke-width="0"/><text x="836" y="410.125" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">迁移会话并适配目标</text><rect x="836" y="433" width="345" height="68" fill="none" stroke="none" stroke-width="0"/><text x="836" y="475.625" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">保持会话归属与处理链一致</text><rect x="64" y="550" width="1117" height="43" fill="#E5EBF3" stroke="none" stroke-width="0"/><rect x="75" y="550" width="1095" height="43" fill="none" stroke="none" stroke-width="0"/><text x="622.5" y="580.875" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle">控制请求与执行时机        音频数据与缓冲        会话与设备处理链</text><line x1="64" y1="604" x2="1214" y2="604" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="617" width="1140" height="35" fill="none" stroke="none" stroke-width="0"/><text x="64" y="644.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">理解这些协作，再比较 PA 与 HPAE 如何组织线程、请求和处理图。</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">本段聚焦普通播放机制；性能与切换体验的量化结论需要设备测试。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">06</text></svg>