<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">一首歌，三个操作</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="137.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">恢复：迟到的完成通知不能拆掉当前通路</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">在执行后续动作的那一刻，检查会话是否已经恢复播放。</text><rect x="65" y="235" width="680" height="32" fill="none" stroke="none" stroke-width="0"/><text x="65" y="260.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">一种需要防护的执行交错</text><rect x="835" y="235" width="360" height="32" fill="none" stroke="none" stroke-width="0"/><text x="835" y="260" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">完成请求执行时，再看当前状态</text><line x1="785" y1="236" x2="785" y2="582" stroke="#DCE5EE" stroke-width="2"/><rect x="66" y="291" width="40" height="38" fill="none" stroke="none" stroke-width="0"/><text x="66" y="320.5" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">1</text><rect x="120" y="291" width="620" height="32" fill="none" stroke="none" stroke-width="0"/><text x="120" y="316.375" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">暂停进入淡出</text><rect x="120" y="325" width="620" height="28" fill="none" stroke="none" stroke-width="0"/><text x="120" y="346.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">输入仍相连</text><line x1="85" y1="333" x2="85" y2="363" stroke="#DCE5EE" stroke-width="3"/><line x1="80.6503446588877" y1="353.9955289764732" x2="85" y2="363" stroke="#DCE5EE" stroke-width="3"/><line x1="89.34965534111231" y1="353.9955289764732" x2="85" y2="363" stroke="#DCE5EE" stroke-width="3"/><rect x="66" y="369" width="40" height="38" fill="none" stroke="none" stroke-width="0"/><text x="66" y="398.5" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">2</text><rect x="120" y="369" width="620" height="32" fill="none" stroke="none" stroke-width="0"/><text x="120" y="394.375" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">淡出结束，完成请求等待执行</text><rect x="120" y="403" width="620" height="28" fill="none" stroke="none" stroke-width="0"/><text x="120" y="424.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">异步通知存在排队窗口</text><line x1="85" y1="411" x2="85" y2="441" stroke="#DCE5EE" stroke-width="3"/><line x1="80.6503446588877" y1="431.9955289764732" x2="85" y2="441" stroke="#DCE5EE" stroke-width="3"/><line x1="89.34965534111231" y1="431.9955289764732" x2="85" y2="441" stroke="#DCE5EE" stroke-width="3"/><rect x="66" y="447" width="40" height="38" fill="none" stroke="none" stroke-width="0"/><text x="66" y="476.5" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">3</text><rect x="120" y="447" width="620" height="32" fill="none" stroke="none" stroke-width="0"/><text x="120" y="472.375" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">恢复请求先执行</text><rect x="120" y="481" width="620" height="28" fill="none" stroke="none" stroke-width="0"/><text x="120" y="502.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">当前会话已恢复播放</text><line x1="85" y1="489" x2="85" y2="519" stroke="#DCE5EE" stroke-width="3"/><line x1="80.6503446588877" y1="509.9955289764732" x2="85" y2="519" stroke="#DCE5EE" stroke-width="3"/><line x1="89.34965534111231" y1="509.9955289764732" x2="85" y2="519" stroke="#DCE5EE" stroke-width="3"/><rect x="66" y="525" width="40" height="38" fill="none" stroke="none" stroke-width="0"/><text x="66" y="554.5" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">4</text><rect x="120" y="525" width="620" height="32" fill="none" stroke="none" stroke-width="0"/><text x="120" y="550.375" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">旧的完成请求随后执行</text><rect x="120" y="559" width="620" height="28" fill="none" stroke="none" stroke-width="0"/><text x="120" y="580.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">此时还能断开输入吗？</text><rect x="845" y="299" width="330" height="58" fill="#12263B" stroke="none" stroke-width="0"/><rect x="857" y="305" width="306" height="46" fill="none" stroke="none" stroke-width="0"/><text x="1010" y="337.75" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="middle">当前已恢复播放？</text><line x1="910" y1="357" x2="910" y2="362.25" stroke="#119A92" stroke-width="2"/><line x1="910" y1="367.5" x2="910" y2="372.75" stroke="#119A92" stroke-width="2"/><line x1="910" y1="378" x2="910" y2="383.25" stroke="#119A92" stroke-width="2"/><line x1="910" y1="388.5" x2="910" y2="393.75" stroke="#119A92" stroke-width="2"/><line x1="910" y1="399" x2="910" y2="404.25" stroke="#119A92" stroke-width="2"/><line x1="910" y1="409.5" x2="910" y2="414.75" stroke="#119A92" stroke-width="2"/><line x1="905.6503446588877" y1="410.9955289764732" x2="910" y2="420" stroke="#119A92" stroke-width="3"/><line x1="914.3496553411123" y1="410.9955289764732" x2="910" y2="420" stroke="#119A92" stroke-width="3"/><rect x="925" y="371" width="100" height="30" fill="none" stroke="none" stroke-width="0"/><text x="925" y="394.625" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="start">是</text><rect x="835" y="425" width="175" height="63" fill="#119A92" stroke="none" stroke-width="0"/><rect x="847" y="431" width="151" height="51" fill="none" stroke="none" stroke-width="0"/><text x="922.5" y="464.75" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">保留当前连接</text><line x1="1110" y1="357" x2="1110" y2="362.25" stroke="#62768A" stroke-width="2"/><line x1="1110" y1="367.5" x2="1110" y2="372.75" stroke="#62768A" stroke-width="2"/><line x1="1110" y1="378" x2="1110" y2="383.25" stroke="#62768A" stroke-width="2"/><line x1="1110" y1="388.5" x2="1110" y2="393.75" stroke="#62768A" stroke-width="2"/><line x1="1110" y1="399" x2="1110" y2="404.25" stroke="#62768A" stroke-width="2"/><line x1="1110" y1="409.5" x2="1110" y2="414.75" stroke="#62768A" stroke-width="2"/><line x1="1105.6503446588877" y1="410.9955289764732" x2="1110" y2="420" stroke="#62768A" stroke-width="3"/><line x1="1114.3496553411123" y1="410.9955289764732" x2="1110" y2="420" stroke="#62768A" stroke-width="3"/><rect x="1123" y="371" width="70" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1123" y="394.625" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">否</text><rect x="1030" y="425" width="174" height="63" fill="none" stroke="#DCE5EE" stroke-width="2"/><rect x="1037" y="430" width="160" height="52" fill="none" stroke="none" stroke-width="0"/><text x="1117" y="463.875" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="middle">继续暂停收尾</text><rect x="840" y="539" width="23" height="22" fill="#119A92" stroke="none" stroke-width="0"/><rect x="870" y="539" width="23" height="22" fill="#119A92" stroke="none" stroke-width="0"/><rect x="900" y="539" width="23" height="22" fill="#119A92" stroke="none" stroke-width="0"/><rect x="930" y="539" width="23" height="22" fill="#119A92" stroke="none" stroke-width="0"/><line x1="967" y1="550" x2="1187" y2="550" stroke="#119A92" stroke-width="3"/><line x1="1177.9955289764732" y1="554.3496553411123" x2="1187" y2="550" stroke="#119A92" stroke-width="3"/><line x1="1177.9955289764732" y1="545.6503446588877" x2="1187" y2="550" stroke="#119A92" stroke-width="3"/><rect x="846" y="502" width="340" height="30" fill="none" stroke="none" stroke-width="0"/><text x="846" y="524.875" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">已经恢复的数据通路继续工作</text><line x1="64" y1="604" x2="1214" y2="604" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="617" width="1140" height="35" fill="none" stroke="none" stroke-width="0"/><text x="64" y="644.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">完成通知属于过去的操作，后续动作必须符合当前状态。</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">条件时序示意；快速点击不保证产生此交错，客户端也有状态检查与等待。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">03</text></svg>