<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">已经恢复播放，旧的暂停还会生效吗？</text><rect x="64" y="139" width="1140" height="39" fill="none" stroke="none" stroke-width="0"/><text x="64" y="169" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">淡出刚结束时，恢复请求已经排在前面。</text><rect x="64" y="212" width="215" height="35" fill="none" stroke="none" stroke-width="0"/><text x="64" y="238.5" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">待执行请求</text><rect x="312" y="211" width="300" height="32" fill="none" stroke="none" stroke-width="0"/><text x="312" y="234.875" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">下一条先执行</text><rect x="312" y="254" width="285" height="62" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="324" y="260" width="261" height="50" fill="none" stroke="none" stroke-width="0"/><text x="454.5" y="295.125" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="middle">① 恢复播放</text><rect x="682" y="254" width="350" height="62" fill="#C97835" stroke="none" stroke-width="0"/><rect x="694" y="260" width="326" height="50" fill="none" stroke="none" stroke-width="0"/><text x="857" y="294.375" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle">② 淡出完成后的收尾</text><line x1="670" y1="285" x2="609" y2="285" stroke="#62768A" stroke-width="3"/><line x1="618.0044710235268" y1="280.6503446588877" x2="609" y2="285" stroke="#62768A" stroke-width="3"/><line x1="618.0044710235268" y1="289.3496553411123" x2="609" y2="285" stroke="#62768A" stroke-width="3"/><rect x="1053" y="260" width="160" height="62" fill="none" stroke="none" stroke-width="0"/><text x="1053" y="285.75" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">随后加入</text><text x="1053" y="312" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">等待执行</text><line x1="64" y1="346" x2="1214" y2="346" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="392" width="140" height="45" fill="#119A92" stroke="none" stroke-width="0"/><rect x="76" y="398" width="116" height="33" fill="none" stroke="none" stroke-width="0"/><text x="134" y="423.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle">音乐 A</text><rect x="64" y="449" width="160" height="32" fill="none" stroke="none" stroke-width="0"/><text x="64" y="473.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">播放状态</text><!-- reveal 1 --><rect x="312" y="372" width="360" height="37" fill="none" stroke="none" stroke-width="0"/><text x="312" y="400.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">执行 ① 恢复播放</text><rect x="312" y="437" width="250" height="55" fill="#119A92" stroke="none" stroke-width="0"/><rect x="324" y="443" width="226" height="43" fill="none" stroke="none" stroke-width="0"/><text x="437" y="474.625" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="middle">正在播放</text><rect x="312" y="512" width="345" height="65" fill="none" stroke="none" stroke-width="0"/><text x="312" y="538.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">输入保持连接</text><text x="312" y="568.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">恢复所需的增益已安排</text><!-- reveal 2 --><rect x="724" y="372" width="470" height="37" fill="none" stroke="none" stroke-width="0"/><text x="724" y="400.625" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">执行 ② 旧的暂停收尾</text><rect x="724" y="435" width="470" height="42" fill="none" stroke="none" stroke-width="0"/><text x="724" y="466.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">检查：现在已经在播放</text><line x1="724" y1="492" x2="1195" y2="492" stroke="#119A92" stroke-width="4"/><rect x="724" y="514" width="470" height="66" fill="none" stroke="none" stroke-width="0"/><text x="724" y="540.75" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">结束这次收尾处理，</text><text x="724" y="572" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">不暂停音效、不拆输入连接。</text><!-- reveal 0 --><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">一种请求交错；不表示每次快速点击都能触发。这里只讨论恢复后尚未再次暂停的情况。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">03</text></svg>