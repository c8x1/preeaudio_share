<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">一首歌，三个操作</text><rect x="64" y="139" width="1120" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="170.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">扬声器正在放歌。我们暂停一下，继续播放，再切到耳机。</text><rect x="64" y="350" width="140" height="45" fill="#119A92" stroke="none" stroke-width="0"/><rect x="76" y="356" width="116" height="33" fill="none" stroke="none" stroke-width="0"/><text x="134" y="381.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle">音乐 A</text><rect x="64" y="403" width="140" height="52" fill="none" stroke="none" stroke-width="0"/><text x="134" y="424" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">同一路音乐</text><text x="134" y="449" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">后文称“会话”</text><rect x="274" y="338" width="180" height="70" fill="none" stroke="#DCE5EE" stroke-width="2"/><rect x="291" y="360" width="24" height="26" fill="#119A92" stroke="none" stroke-width="0"/><rect x="323" y="360" width="24" height="26" fill="#119A92" stroke="none" stroke-width="0"/><rect x="355" y="360" width="24" height="26" fill="#119A92" stroke="none" stroke-width="0"/><rect x="387" y="360" width="24" height="26" fill="#119A92" stroke="none" stroke-width="0"/><rect x="274" y="423" width="180" height="34" fill="none" stroke="none" stroke-width="0"/><text x="364" y="448.625" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="