<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">切到耳机，哪些东西变了？</text><rect x="64" y="138" width="1140" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="168.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">同一路音乐保留下来，设备归属和处理连接随目标变化。</text><line x1="64" y1="293" x2="1214" y2="293" stroke="#DCE5EE" stroke-width="2"/><line x1="64" y1="446" x2="1214" y2="446" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="214" width="170" height="37" fill="none" stroke="none" stroke-width="0"/><text x="64" y="242.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">① 切换前</text><rect x="254" y="209" width="140" height="45" fill="#119A92" stroke="none" stroke-width="0"/><rect x="266" y="215" width="116" height="33" fill="none" stroke="none" stroke-width="0"/><text x="324" y="240.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle">音乐 A</text><line x1="394" y1="232" x2="490" y2="232" stroke="#119A92" stroke-width="3"/><line x1="480.9955289764732" y1="236.3496553411123" x2="490" y2="232" stroke="#119A92" stroke-width="3"/><line x1="480.9955289764732" y1="227.6503446588877" x2="490" y2="232" stroke="#119A92" stroke-width="3"/><rect x="490" y="204" width="350" height="56" fill="#12263B" stroke="none" stroke-width="0"/><rect x="502" y="210" width="326" height="44" fill="none" stroke="none" stroke-width="0"/><text x="665" y="241.375" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle">扬声器侧处理链</text><line x1="840" y1="232" x2="915" y2="232" stroke="#119A92" stroke-width="3"/><line x1="905.9955289764732" y1="236.3496553411123" x2="915" y2="232" stroke="#119A92" stroke-width="3"/><line x1="905.9955289764732" y1="227.6503446588877" x2="915" y2="232" stroke="#119A92" stroke-width="3"/><rect x="936" y="209" width="250" height="42" fill="none" stroke="none" stroke-width="0"/><text x="936" y="239.75" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">扬声器出声</text><rect x="490" y="264" width="620" height="26" fill="none" stroke="none" stroke-width="0"/><text x="490" y="284.875" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">会话归属：扬声器</text><!-- reveal 1 --><rect x="64" y="360" width="170" height="37" fill="none" stroke="none" stroke-width="0"/><text x="64" y="388.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">② 交接中</text><rect x="254" y="355" width="140" height="45" fill="#119A92" stroke="none" stroke-width="0"/><rect x="266" y="361" width="116" height="33" fill="none" stroke="none" stroke-width="0"/><text x="324" y="386.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle">音乐 A</text><line x1="394" y1="377" x2="430" y2="377" stroke="#62768A" stroke-width="2"/><line x1="440" y1="366" x2="460" y2="389" stroke="#C97835" stroke-width="3"/><line x1="460" y1="366" x2="440" y2="389" stroke="#C97835" stroke-width="3"/><rect x="492" y="327" width="680" height="38" fill="none" stroke="none" stroke-width="0"/><text x="492" y="355.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">摘除旧连接，交接同一个会话</text><rect x="492" y="371" width="700" height="30" fill="none" stroke="none" stroke-width="0"/><text x="492" y="394.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">设备信息改为耳机；处理粒度跟着目标走，否则数据与设备对不上拍</text><rect x="492" y="403" width="700" height="30" fill="none" stroke="none" stroke-width="0"/><text x="492" y="426.25" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">朴素做法：停下重开，缓冲数据与播放状态全部重来</text><!-- reveal 2 --><rect x="64" y="515" width="170" height="37" fill="none" stroke="none" stroke-width="0"/><text x="64" y="543.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">③ 接入后</text><rect x="254" y="509" width="140" height="45" fill="#119A92" stroke="none" stroke-width="0"/><rect x="266" y="515" width="116" height="33" fill="none" stroke="none" stroke-width="0"/><text x="324" y="540.5" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle">音乐 A</text><line x1="394" y1="532" x2="490" y2="532" stroke="#119A92" stroke-width="3"/><line x1="480.9955289764732" y1="536.3496553411123" x2="490" y2="532" stroke="#119A92" stroke-width="3"/><line x1="480.9955289764732" y1="527.6503446588877" x2="490" y2="532" stroke="#119A92" stroke-width="3"/><rect x="490" y="504" width="350" height="56" fill="#119A92" stroke="none" stroke-width="0"/><rect x="502" y="510" width="326" height="44" fill="none" stroke="none" stroke-width="0"/><text x="665" y="541.375" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle">耳机侧处理链</text><line x1="840" y1="532" x2="915" y2="532" stroke="#119A92" stroke-width="3"/><line x1="905.9955289764732" y1="536.3496553411123" x2="915" y2="532" stroke="#119A92" stroke-width="3"/><line x1="905.9955289764732" y1="527.6503446588877" x2="915" y2="532" stroke="#119A92" stroke-width="3"/><rect x="936" y="509" width="250" height="42" fill="none" stroke="none" stroke-width="0"/><text x="936" y="539.75" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">耳机输出</text><rect x="490" y="568" width="650" height="31" fill="none" stroke="none" stroke-width="0"/><text x="490" y="592.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">会话归属更新；运行中的会话接入目标链</text><!-- reveal 0 --><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">三幅为阶段示意，不是实测时间线。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">05</text></svg>