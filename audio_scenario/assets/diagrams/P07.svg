<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">三个保证，落在代码的哪里？</text><rect x="64" y="136" width="1140" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="167.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">三个保证不是设计愿望，各有具体落点。</text><rect x="224" y="196" width="480" height="32" fill="none" stroke="none" stroke-width="0"/><text x="224" y="220.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="start">引擎的保证</text><rect x="724" y="196" width="500" height="32" fill="none" stroke="none" stroke-width="0"/><text x="724" y="220.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="start">代码里的落点</text><!-- reveal 1 --><rect x="64" y="232" width="140" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="262.125" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">暂停</text><rect x="224" y="228" width="480" height="48" fill="#12263B" stroke="none" stroke-width="0"/><rect x="236" y="234" width="456" height="36" fill="none" stroke="none" stroke-width="0"/><text x="464" y="260.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">渐变挂在增益节点上，逐帧执行</text><rect x="724" y="232" width="500" height="40" fill="none" stroke="none" stroke-width="0"/><text x="724" y="260.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">做完才回调收尾，收尾再排队</text><rect x="64" y="310" width="140" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="340.125" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">恢复</text><rect x="224" y="306" width="480" height="48" fill="#12263B" stroke="none" stroke-width="0"/><rect x="236" y="312" width="456" height="36" fill="none" stroke="none" stroke-width="0"/><text x="464" y="338.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">第一步就把状态改成“运行中”</text><rect x="724" y="310" width="500" height="40" fill="none" stroke="none" stroke-width="0"/><text x="724" y="338.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">旧收尾首行检查它，已运行即返回</text><!-- reveal 2 --><rect x="64" y="388" width="140" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="418.125" fill="#887798" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">淡入时机</text><rect x="224" y="384" width="480" height="48" fill="#12263B" stroke="none" stroke-width="0"/><rect x="236" y="390" width="456" height="36" fill="none" stroke="none" stroke-width="0"/><text x="464" y="416.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">接通后立刻挂淡入，再启动音效</text><rect x="724" y="388" width="500" height="40" fill="none" stroke="none" stroke-width="0"/><text x="724" y="416.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">注释写明：晚了会漏全音量数据帧</text><rect x="64" y="466" width="140" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="496.125" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">切耳机</text><rect x="224" y="462" width="480" height="48" fill="#12263B" stroke="none" stroke-width="0"/><rect x="236" y="468" width="456" height="36" fill="none" stroke="none" stroke-width="0"/><text x="464" y="494.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">节点带状态交接，目标侧调帧长</text><rect x="724" y="466" width="500" height="40" fill="none" stroke="none" stroke-width="0"/><text x="724" y="494.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">只有运行中的会话才接入新链</text><rect x="64" y="560" width="1140" height="80" fill="none" stroke="none" stroke-width="0"/><text x="64" y="593.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">一个状态标志、一行状态检查、一个先后顺序、一次参数调整，</text><text x="64" y="626" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">复杂性摊开看，是这些小保证的叠加。</text><!-- reveal 0 --><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">左列为引擎行为，右列为代码落点；行号见讲稿附录。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">07</text></svg>