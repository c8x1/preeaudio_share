<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">淡入为什么要先于音效启动？</text><rect x="64" y="136" width="1140" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="167.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">已有音频数据等待处理时，接通之后的增益设置不能拖后。</text><rect x="300" y="208" width="235" height="35" fill="none" stroke="none" stroke-width="0"/><text x="417.5" y="234.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle">接通处理链</text><line x1="350" y1="252" x2="350" y2="583" stroke="#DCE5EE" stroke-width="1"/><rect x="570" y="208" width="235" height="35" fill="none" stroke="none" stroke-width="0"/><text x="687.5" y="234.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle">音效启动中</text><line x1="620" y1="252" x2="620" y2="583" stroke="#DCE5EE" stroke-width="1"/><rect x="950" y="208" width="235" height="35" fill="none" stroke="none" stroke-width="0"/><text x="1067.5" y="234.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle">音效启动完成</text><line x1="1000" y1="252" x2="1000" y2="583" stroke="#DCE5EE" stroke-width="1"/><rect x="64" y="281" width="230" height="65" fill="none" stroke="none" stroke-width="0"/><text x="64" y="322.875" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">如果淡入设置晚了</text><rect x="350" y="286" width="650" height="57" fill="#F9EBDC" stroke="none" stroke-width="0"/><rect x="365" y="297" width="615" height="35" fill="none" stroke="none" stroke-width="0"/><text x="672.5" y="323.125" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">这段窗口内，预缓冲数据可能按全增益输出</text><line x1="350" y1="385" x2="1000" y2="385" stroke="#C97835" stroke-width="4"/><rect x="350" y="351" width="390" height="30" fill="none" stroke="none" stroke-width="0"/><text x="350" y="373.875" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">增益尚未按淡入设置</text><rect x="1025" y="292" width="175" height="65" fill="none" stroke="none" stroke-width="0"/><text x="1025" y="318.75" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="start">到这时</text><text x="1025" y="347.5" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="start">才设置淡入</text><!-- reveal 1 --><line x1="64" y1="423" x2="1214" y2="423" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="467" width="230" height="65" fill="none" stroke="none" stroke-width="0"/><text x="64" y="508.875" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">实际处理顺序</text><rect x="350" y="472" width="205" height="53" fill="#119A92" stroke="none" stroke-width="0"/><rect x="362" y="478" width="181" height="41" fill="none" stroke="none" stroke-width="0"/><text x="452.5" y="507.875" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle">先设置淡入</text><line x1="555" y1="498" x2="560" y2="498" stroke="#3379EB" stroke-width="2"/><line x1="565" y1="498" x2="570" y2="498" stroke="#3379EB" stroke-width="2"/><line x1="575" y1="498" x2="580" y2="498" stroke="#3379EB" stroke-width="2"/><line x1="585" y1="498" x2="590" y2="498" stroke="#3379EB" stroke-width="2"/><line x1="595" y1="498" x2="600" y2="498" stroke="#3379EB" stroke-width="2"/><line x1="605" y1="498" x2="610" y2="498" stroke="#3379EB" stroke-width="2"/><line x1="605.9955289764732" y1="502.3496553411123" x2="615" y2="498" stroke="#3379EB" stroke-width="3"/><line x1="605.9955289764732" y1="493.6503446588877" x2="615" y2="498" stroke="#3379EB" stroke-width="3"/><rect x="636" y="473" width="360" height="50" fill="none" stroke="none" stroke-width="0"/><text x="636" y="507.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">再启动会话音效</text><line x1="350" y1="582" x2="1000" y2="540" stroke="#119A92" stroke-width="4"/><rect x="645" y="601" width="510" height="35" fill="none" stroke="none" stroke-width="0"/><text x="645" y="627.125" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">示意：已有数据按淡入处理</text><!-- reveal 0 --><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">上行为假设的错误顺序，下行为实际顺序；增益曲线仅示意，不表达淡入时长。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">04</text></svg>