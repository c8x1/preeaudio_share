<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">一首歌，三个操作</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="137.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">恢复播放：第一段声音的增益要先安排好</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">处理链接入之后，音效启动之前，先布置淡入。</text><rect x="224" y="244" width="250" height="38" fill="none" stroke="none" stroke-width="0"/><text x="224" y="273.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">1  接入处理链</text><rect x="540" y="244" width="250" height="38" fill="none" stroke="none" stroke-width="0"/><text x="540" y="273.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">2  设置淡入</text><rect x="880" y="244" width="250" height="38" fill="none" stroke="none" stroke-width="0"/><text x="880" y="273.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">3  启动会话音效</text><line x1="435" y1="263" x2="443.3333333333333" y2="263" stroke="#3379EB" stroke-width="2"/><line x1="451.6666666666667" y1="263" x2="460" y2="263" stroke="#3379EB" stroke-width="2"/><line x1="468.3333333333333" y1="263" x2="476.6666666666667" y2="263" stroke="#3379EB" stroke-width="2"/><line x1="485" y1="263" x2="493.3333333333333" y2="263" stroke="#3379EB" stroke-width="2"/><line x1="501.6666666666667" 