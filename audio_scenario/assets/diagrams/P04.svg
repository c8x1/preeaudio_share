ke="none" stroke-width="0"/><rect x="346" y="437" width="29" height="34" fill="#119A92" stroke="none" stroke-width="0"/><rect x="267" y="491" width="205" height="30" fill="none" stroke="none" stroke-width="0"/><text x="267" y="513.875" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">接通后即可参与处理</text><line x1="488" y1="418" x2="560" y2="418" stroke="#119A92" stroke-width="3"/><line x1="550.9955289764732" y1="422.3496553411123" x2="560" y2="418" stroke="#119A92" stroke-width="3"/><line x1="550.9955289764732" y1="413.6503446588877" x2="560" y2="418" stroke="#119A92" stroke-width="3"/><rect x="570" y="314" width="265" height="228" fill="#E1F2EF" stroke="none" stroke-width="0"/><rect x="590" y="329" width="225" height="36" fill="none" stroke="none" stroke-width="0"/><text x="590" y="356" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">先布置增益变化</text><line x1="595" y1="477" x2="810" y2="477" stroke="#DCE5EE" stroke-width="2"/><line x1="595" y1="477" x2="810" y2="387" stroke="#119A92" stroke-width="4"/><rect x="590" y="491" width="225" height="30" fill="none" stroke="none" stroke-width="0"/><text x="590" y="513.875" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">第一段声音按淡入处理</text><rect x="886" y="314" width="319" height="228" fill="none" stroke="#DCE5EE" stroke-width="2"/><rect x="907" y="329" width="280" height="36" fill="none" stroke="none" stroke-width="0"/><text x="907" y="356" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">音效启动需要处理时间</text><line x1="913" y1="416" x2="1180" y2="416" stroke="#3379EB" stroke-width="5"/><line x1="913" y1="405" x2="913" y2="427" stroke="#3379EB" stroke-width="3"/><line x1="1180" y1="405" x2="1180" y2="427" stroke="#3379EB" stroke-width="3"/><rect x="907" y="446" width="270" height="70" fill="none" stroke="none" stroke-width="0"/><text x="907" y="475" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">已有预缓冲数据时，</text><text x="907" y="505" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">淡入不能等到这之后</text><line x1="64" y1="604" x2="1214" y2="604" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="617" width="1140" height="35" fill="none" stroke="none" stroke-width="0"/><text x="64" y="644.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">连接后及时设置淡入，避免启动窗口内出现全增益输出。</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">按启用会话音效的路径示意；图为控制顺序与数据条件，不表示数据串行流过这些步骤。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">04</text></svg>