<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#F8FAFD"/><rect x="54" y="21" width="1150" height="24" fill="none" stroke="none" stroke-width="0"/><text x="54" y="39" fill="#087F7A" font-family="Microsoft YaHei" font-size="16" font-weight="700" text-anchor="start">故事二 · 控制交接</text><rect x="54" y="62" width="1170" height="60" fill="none" stroke="none" stroke-width="0"/><text x="54" y="107.75" fill="#12263B" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="start">旧新两种工作交接：谁在等待谁？</text><rect x="54" y="132" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="161.375" fill="#526679" font-family="Microsoft YaHei" font-size="25" font-weight="400" text-anchor="start">控制线程不能任意拆正在处理的图，需要进入对应执行上下文</text><rect x="54" y="215" width="220" height="74" fill="#12263B" stroke="#DBE4EE"/><text x="66" y="246" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">观察同一问题</text><rect x="274" y="215" width="475" height="74" fill="#12263B" stroke="#DBE4EE"/><text x="286" y="246" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">5.1 PA 控制路径</text><rect x="749" y="215" width="475" height="74" fill="#12263B" stroke="#DBE4EE"/><text x="761" y="246" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">当前 HPAE 普通路径</text><rect x="54" y="289" width="220" height="74" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="320" fill="#12263B" font-family="Microsoft YaHei" font-size="21">框架怎样交接</text><rect x="274" y="289" width="475" height="74" fill="#FFFFFF" stroke="#DBE4EE"/><text x="286" y="320" fill="#12263B" font-family="Microsoft YaHei" font-size="21">PaLockGuard(mainloop)</text><text x="286" y="345.2" fill="#12263B" font-family="Microsoft YaHei" font-size="21">pa_stream_cork提交命令</text><rect x="749" y="289" width="475" height="74" fill="#FFFFFF" stroke="#DBE4EE"/><text x="761" y="320" fill="#12263B" font-family="Microsoft YaHei" font-size="21">保存sessionId的闭包</text><text x="761" y="345.2" fill="#12263B" font-family="Microsoft YaHei" font-size="21">SendRequest发布</text><rect x="54" y="363" width="220" height="74" fill="#EFF4FA" stroke="#DBE4EE"/><text x="66" y="394" fill="#12263B" font-family="Microsoft YaHei" font-size="21">谁改变执行状态</text><rect x="274" y="363" width="475" height="74" fill="#EFF4FA" stroke="#DBE4EE"/><text x="286" y="394" fill="#12263B" font-family="Microsoft YaHei" font-size="21">协议 → PA控制上下文</text><text x="286" y="419.2" fill="#12263B" font-family="Microsoft YaHei" font-size="21">send(SET_STATE)到sink I/O</text><rect x="749" y="363" width="475" height="74" fill="#EFF4FA" stroke="#DBE4EE"/><text x="761" y="394" fill="#12263B" font-family="Microsoft YaHei" font-size="21">设备队列 → HandleMsg</text><text x="761" y="419.2" fill="#12263B" font-family="Microsoft YaHei" font-size="21">消费闭包后才Process</text><rect x="54" y="437" width="220" height="74" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="468" fill="#12263B" font-family="Microsoft YaHei" font-size="21">谁等待谁</text><rect x="274" y="437" width="475" height="74" fill="#FFFFFF" stroke="#DBE4EE"/><text x="286" y="468" fill="#12263B" font-family="Microsoft YaHei" font-size="21">send等待I/O处理</text><text x="286" y="493.2" fill="#12263B" font-family="Microsoft YaHei" font-size="21">ACK后框架操作回调</text><rect x="749" y="437" width="475" height="74" fill="#FFFFFF" stroke="#DBE4EE"/><text x="761" y="468" fill="#12263B" font-family="Microsoft YaHei" font-size="21">发布不等待业务完成</text><text x="761" y="493.2" fill="#12263B" font-family="Microsoft YaHei" font-size="21">消费侧闭包逐项执行</text><rect x="54" y="511" width="220" height="74" fill="#EFF4FA" stroke="#DBE4EE"/><text x="66" y="542" fill="#12263B" font-family="Microsoft YaHei" font-size="21">原子与锁的层次</text><rect x="274" y="511" width="475" height="74" fill="#EFF4FA" stroke="#DBE4EE"/><text x="286" y="542" fill="#12263B" font-family="Microsoft YaHei" font-size="21">多写端包装有mutex</text><text x="286" y="567.2" fill="#12263B" font-family="Microsoft YaHei" font-size="21">asyncq槽位有原子操作</text><rect x="749" y="511" width="475" height="74" fill="#EFF4FA" stroke="#DBE4EE"/><text x="761" y="542" fill="#12263B" font-family="Microsoft YaHei" font-size="21">常规请求链表用CAS</text><text x="761" y="567.2" fill="#12263B" font-family="Microsoft YaHei" font-size="21">Notify / 扩容仍有锁</text><rect x="54" y="612" width="1170" height="42" fill="none" stroke="none" stroke-width="0"/><text x="54" y="642" fill="#12263B" font-family="Microsoft YaHei" font-size="24" font-weight="700" text-anchor="start">比较同步边界与完成语义：发布更轻，不会让音效、接图或设备准备瞬间完成</text><rect x="54" y="670" width="1080" height="29" fill="none" stroke="none" stroke-width="0"/><text x="54" y="690.125" fill="#526679" font-family="Microsoft YaHei" font-size="15" font-weight="400" text-anchor="start">比较选定的状态控制路径；PA也有异步post与底层原子槽位，HPAE不等于全链无锁</text><rect x="1158" y="670" width="66" height="29" fill="none" stroke="none" stroke-width="0"/><text x="1224" y="691.25" fill="#526679" font-family="Microsoft YaHei" font-size="18" font-weight="400" text-anchor="end">05</text></svg>