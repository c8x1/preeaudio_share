<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#F8FAFD"/><rect x="54" y="21" width="1150" height="24" fill="none" stroke="none" stroke-width="0"/><text x="54" y="39" fill="#087F7A" font-family="Microsoft YaHei" font-size="16" font-weight="700" text-anchor="start">故事二 · Pause状态与完成条件</text><rect x="54" y="62" width="1170" height="60" fill="none" stroke="none" stroke-width="0"/><text x="54" y="107.75" fill="#12263B" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="start">Pause 已开始，为什么先不拆连接？</text><rect x="54" y="132" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="161.375" fill="#526679" font-family="Microsoft YaHei" font-size="25" font-weight="400" text-anchor="start">中间态保留处理机会；有样本、无效输入和直接完成是三条条件分支</text><rect x="54" y="205" width="1170" height="36" fill="none" stroke="none" stroke-width="0"/><text x="54" y="231.625" fill="#12263B" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="start">普通分支前提：输入与Gain存在、设备运行、非standby；Pause已被消费</text><rect x="54" y="259" width="360" height="62" fill="#12263B" stroke="#DBE4EE"/><text x="66" y="290" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">PAUSING后的Process输入</text><rect x="414" y="259" width="510" height="62" fill="#12263B" stroke="#DBE4EE"/><text x="426" y="290" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">Gain执行的工作</text><rect x="924" y="259" width="300" height="62" fill="#12263B" stroke="#DBE4EE"/><text x="936" y="290" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">完成事件</text><rect x="54" y="321" width="360" height="62" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="352" fill="#12263B" font-family="Microsoft YaHei" font-size="21">有效样本</text><rect x="414" y="321" width="510" height="62" fill="#FFFFFF" stroke="#DBE4EE"/><text x="426" y="352" fill="#12263B" font-family="Microsoft YaHei" font-size="21">ApplyFadeOut：处理样本增益</text><text x="426" y="377.2" fill="#12263B" font-family="Microsoft YaHei" font-size="21">再置DONE_FADEOUT</text><rect x="924" y="321" width="300" height="62" fill="#FFFFFF" stroke="#DBE4EE"/><text x="936" y="352" fill="#12263B" font-family="Microsoft YaHei" font-size="21">调用OnFadeDone</text><rect x="54" y="383" width="360" height="62" fill="#EFF4FA" stroke="#DBE4EE"/><text x="66" y="414" fill="#12263B" font-family="Microsoft YaHei" font-size="21">无效输入，且DO_FADEOUT</text><rect x="414" y="383" width="510" height="62" fill="#EFF4FA" stroke="#DBE4EE"/><text x="426" y="414" fill="#12263B" font-family="Microsoft YaHei" font-size="21">不做样本渐变</text><text x="426" y="439.2" fill="#12263B" font-family="Microsoft YaHei" font-size="21">直接置DONE_FADEOUT</text><rect x="924" y="383" width="300" height="62" fill="#EFF4FA" stroke="#DBE4EE"/><text x="936" y="414" fill="#12263B" font-family="Microsoft YaHei" font-size="21">仍调用OnFadeDone</text><rect x="54" y="488" width="245" height="69" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="64" y="493" width="225" height="59" fill="none" stroke="none" stroke-width="0"/><text x="176.5" y="517" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">PAUSING</text><text x="176.5" y="544.5" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">暂时保留连接</text><line x1="299" y1="522" x2="352" y2="522" stroke="#3379EB" stroke-width="2.5" /><line x1="342.9955289764732" y1="526.3496553411123" x2="352" y2="522" stroke="#3379EB" stroke-width="2.5" /><line x1="342.9955289764732" y1="517.6503446588877" x2="352" y2="522" stroke="#3379EB" stroke-width="2.5" /><rect x="352" y="488" width="245" height="69" fill="#087F7A" stroke="none" stroke-width="0"/><rect x="362" y="493" width="225" height="59" fill="none" stroke="none" stroke-width="0"/><text x="474.5" y="517" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">OnFadeDone</text><text x="474.5" y="544.5" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">发布收尾闭包F</text><line x1="597" y1="522" x2="650" y2="522" stroke="#3379EB" stroke-width="2.5" /><line x1="640.9955289764732" y1="526.3496553411123" x2="650" y2="522" stroke="#3379EB" stroke-width="2.5" /><line x1="640.9955289764732" y1="517.6503446588877" x2="650" y2="522" stroke="#3379EB" stroke-width="2.5" /><rect x="650" y="488" width="245" height="69" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="660" y="493" width="225" height="59" fill="none" stroke="none" stroke-width="0"/><text x="772.5" y="517" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">后续HandleMsg</text><text x="772.5" y="544.5" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">执行F并检查状态</text><line x1="895" y1="522" x2="948" y2="522" stroke="#3379EB" stroke-width="2.5" /><line x1="938.9955289764732" y1="526.3496553411123" x2="948" y2="522" stroke="#3379EB" stroke-width="2.5" /><line x1="938.9955289764732" y1="517.6503446588877" x2="948" y2="522" stroke="#3379EB" stroke-width="2.5" /><rect x="948" y="488" width="276" height="69" fill="#087F7A" stroke="none" stroke-width="0"/><rect x="958" y="493" width="256" height="59" fill="none" stroke="none" stroke-width="0"/><text x="1086" y="517" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">仍PAUSING：断开输入</text><text x="1086" y="544.5" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">PAUSED + 回调</text><rect x="54" y="594" width="1170" height="62" fill="none" stroke="none" stroke-width="0"/><text x="54" y="619.5" fill="#526679" font-family="Microsoft YaHei" font-size="22" font-weight="400" text-anchor="start">另一条旁路：无Gain / 设备未运行 / standby / 已暂停或停止</text><text x="54" y="647" fill="#526679" font-family="Microsoft YaHei" font-size="22" font-weight="400" text-anchor="start">SetSessionFade直接写终态并回调；返回Pause后断图，不等Gain事件</text><rect x="54" y="670" width="1080" height="29" fill="none" stroke="none" stroke-width="0"/><text x="54" y="690.125" fill="#526679" font-family="Microsoft YaHei" font-size="15" font-weight="400" text-anchor="start">普通非INTERPHONE、非工厂构建且回调有效；F执行时输入仍在且仍PAUSING，恢复竞态见下一页</text><rect x="1158" y="670" width="66" height="29" fill="none" stroke="none" stroke-width="0"/><text x="1224" y="691.25" fill="#526679" font-family="Microsoft YaHei" font-size="18" font-weight="400" text-anchor="end">08</text></svg>