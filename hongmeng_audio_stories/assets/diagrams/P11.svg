<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#F8FAFD"/><rect x="54" y="21" width="1150" height="24" fill="none" stroke="none" stroke-width="0"/><text x="54" y="39" fill="#087F7A" font-family="Microsoft YaHei" font-size="16" font-weight="700" text-anchor="start">故事三 · 三种标识与分支</text><rect x="54" y="62" width="1170" height="60" fill="none" stroke="none" stroke-width="0"/><text x="54" y="107.75" fill="#12263B" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="start">看到 Move 日志，就发生了节点迁移吗？</text><rect x="54" y="132" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="161.375" fill="#526679" font-family="Microsoft YaHei" font-size="25" font-weight="400" text-anchor="start">分别追踪device、pipe和sink；方法入口不能代替最终分支</text><rect x="54" y="214" width="340" height="64" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="64" y="219" width="320" height="54" fill="none" stroke="none" stroke-width="0"/><text x="224" y="255" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="24" font-weight="700" text-anchor="middle">device：物理输出目标</text><rect x="469" y="214" width="340" height="64" fill="#816C97" stroke="none" stroke-width="0"/><rect x="479" y="219" width="320" height="54" fill="none" stroke="none" stroke-width="0"/><text x="639" y="255" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="24" font-weight="700" text-anchor="middle">pipe：策略执行计划</text><rect x="884" y="214" width="340" height="64" fill="#087F7A" stroke="none" stroke-width="0"/><rect x="894" y="219" width="320" height="54" fill="none" stroke="none" stroke-width="0"/><text x="1054" y="255" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="24" font-weight="700" text-anchor="middle">sink：引擎归属名称</text><rect x="54" y="315" width="270" height="60" fill="#12263B" stroke="#DBE4EE"/><text x="66" y="346" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">沿一次合法分支</text><rect x="324" y="315" width="550" height="60" fill="#12263B" stroke="#DBE4EE"/><text x="336" y="346" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">具体判断 / 动作</text><rect x="874" y="315" width="350" height="60" fill="#12263B" stroke="#DBE4EE"/><text x="886" y="346" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">不能据此推出</text><rect x="54" y="375" width="270" height="60" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="406" fill="#12263B" font-family="Microsoft YaHei" font-size="21">① 目标device不同</text><rect x="324" y="375" width="550" height="60" fill="#FFFFFF" stroke="#DBE4EE"/><text x="336" y="406" fill="#12263B" font-family="Microsoft YaHei" font-size="21">扬声器 → 耳机</text><rect x="874" y="375" width="350" height="60" fill="#FFFFFF" stroke="#DBE4EE"/><text x="886" y="406" fill="#12263B" font-family="Microsoft YaHei" font-size="21">pipe必然不同</text><rect x="54" y="435" width="270" height="60" fill="#EFF4FA" stroke="#DBE4EE"/><text x="66" y="466" fill="#12263B" font-family="Microsoft YaHei" font-size="21">② pipe名称或标识相同</text><rect x="324" y="435" width="550" height="60" fill="#EFF4FA" stroke="#DBE4EE"/><text x="336" y="466" fill="#12263B" font-family="Microsoft YaHei" font-size="21">计划可为DEFAULT；与MOVE共分支</text><rect x="874" y="435" width="350" height="60" fill="#EFF4FA" stroke="#DBE4EE"/><text x="886" y="466" fill="#12263B" font-family="Microsoft YaHei" font-size="21">不会调用Move接口</text><rect x="54" y="495" width="270" height="60" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="526" fill="#12263B" font-family="Microsoft YaHei" font-size="21">③ Move传入目标sinkName</text><rect x="324" y="495" width="550" height="60" fill="#FFFFFF" stroke="#DBE4EE"/><text x="336" y="526" fill="#12263B" font-family="Microsoft YaHei" font-size="21">CheckMove通过，且与当前sink相同</text><text x="336" y="551.2" fill="#12263B" font-family="Microsoft YaHei" font-size="21">HPAE成功早退，不向旧Renderer发移动</text><rect x="874" y="495" width="350" height="60" fill="#FFFFFF" stroke="#DBE4EE"/><text x="886" y="526" fill="#12263B" font-family="Microsoft YaHei" font-size="21">调用Move = 跨Renderer搬输入</text><rect x="54" y="555" width="270" height="60" fill="#EFF4FA" stroke="#DBE4EE"/><text x="66" y="586" fill="#12263B" font-family="Microsoft YaHei" font-size="21">④ 后续设备route</text><rect x="324" y="555" width="550" height="60" fill="#EFF4FA" stroke="#DBE4EE"/><text x="336" y="586" fill="#12263B" font-family="Microsoft YaHei" font-size="21">普通运行流再按条件更新输出route</text><rect x="874" y="555" width="350" height="60" fill="#EFF4FA" stroke="#DBE4EE"/><text x="886" y="586" fill="#12263B" font-family="Microsoft YaHei" font-size="21">同sink意味着物理输出不变</text><rect x="54" y="630" width="1170" height="28" fill="none" stroke="none" stroke-width="0"/><text x="54" y="652.25" fill="#12263B" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="start">教学配置：两设备映射同一primary sink；真正跨sink的分支下一页展开</text><rect x="54" y="670" width="1080" height="29" fill="none" stroke="none" stroke-width="0"/><text x="54" y="690.125" fill="#526679" font-family="Microsoft YaHei" font-size="15" font-weight="400" text-anchor="start">普通运行且非重建等特殊路径；同sink早退须先通过CheckMove；产品映射需核对部署XML</text><rect x="1158" y="670" width="66" height="29" fill="none" stroke="none" stroke-width="0"/><text x="1224" y="691.25" fill="#526679" font-family="Microsoft YaHei" font-size="18" font-weight="400" text-anchor="end">11</text></svg>