<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#F8FAFD"/><rect x="54" y="21" width="1150" height="24" fill="none" stroke="none" stroke-width="0"/><text x="54" y="39" fill="#087F7A" font-family="Microsoft YaHei" font-size="16" font-weight="700" text-anchor="start">故事一 · 等待边界</text><rect x="54" y="62" width="1170" height="60" fill="none" stroke="none" stroke-width="0"/><text x="54" y="107.75" fill="#12263B" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="start">A 已经生成，为什么 B 还在上游？</text><rect x="54" y="132" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="161.375" fill="#526679" font-family="Microsoft YaHei" font-size="25" font-weight="400" text-anchor="start">旧主输出有跨线程交接，也有 dflag 门控生产节奏</text><rect x="60" y="205" width="240" height="40" fill="none" stroke="none" stroke-width="0"/><text x="180" y="233.625" fill="#12263B" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="middle">PA渲染线程</text><line x1="180" y1="252" x2="180" y2="627" stroke="#DBE4EE" stroke-width="2" /><rect x="380" y="205" width="240" height="40" fill="none" stroke="none" stroke-width="0"/><text x="500" y="233.625" fill="#12263B" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="middle">primary.dq</text><line x1="500" y1="252" x2="500" y2="627" stroke="#DBE4EE" stroke-width="2" /><rect x="700" y="205" width="240" height="40" fill="none" stroke="none" stroke-width="0"/><text x="820" y="233.625" fill="#12263B" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="middle">HDI写线程</text><line x1="820" y1="252" x2="820" y2="627" stroke="#DBE4EE" stroke-width="2" /><rect x="990" y="205" width="240" height="40" fill="none" stroke="none" stroke-width="0"/><text x="1110" y="233.625" fill="#12263B" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="middle">设备接口</text><line x1="1110" y1="252" x2="1110" y2="627" stroke="#DBE4EE" stroke-width="2" /><rect x="54" y="269" width="250" height="54" fill="#12263B" stroke="none" stroke-width="0"/><rect x="64" y="274" width="230" height="44" fill="none" stroke="none" stroke-width="0"/><text x="179" y="304.25" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">dflag++，生成 A</text><line x1="180" y1="355" x2="500" y2="355" stroke="#3379EB" stroke-width="2.5" /><line x1="490.9955289764732" y1="359.3496553411123" x2="500" y2="355" stroke="#3379EB" stroke-width="2.5" /><line x1="490.9955289764732" y1="350.6503446588877" x2="500" y2="355" stroke="#3379EB" stroke-width="2.5" /><rect x="188" y="324" width="306" height="29" fill="none" stroke="none" stroke-width="0"/><text x="188" y="346.75" fill="#3379EB" font-family="Microsoft YaHei" font-size="22" font-weight="400" text-anchor="start">post：A 的引用</text><line x1="500" y1="410" x2="820" y2="410" stroke="#3379EB" stroke-width="2.5" /><line x1="810.9955289764732" y1="414.3496553411123" x2="820" y2="410" stroke="#3379EB" stroke-width="2.5" /><line x1="810.9955289764732" y1="405.6503446588877" x2="820" y2="410" stroke="#3379EB" stroke-width="2.5" /><rect x="508" y="379" width="306" height="29" fill="none" stroke="none" stroke-width="0"/><text x="508" y="401.75" fill="#3379EB" font-family="Microsoft YaHei" font-size="22" font-weight="400" text-anchor="start">get：取出 A</text><rect x="54" y="425" width="430" height="70" fill="none" stroke="none" stroke-width="0"/><text x="54" y="454.25" fill="#B96320" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="start">下一轮见 dflag == 1</text><text x="54" y="483" fill="#B96320" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="start">等待，尚不生成 B</text><line x1="820" y1="487" x2="1110" y2="487" stroke="#087F7A" stroke-width="2.5" /><line x1="1100.9955289764732" y1="491.3496553411123" x2="1110" y2="487" stroke="#087F7A" stroke-width="2.5" /><line x1="1100.9955289764732" y1="482.6503446588877" x2="1110" y2="487" stroke="#087F7A" stroke-width="2.5" /><rect x="828" y="456" width="276" height="29" fill="none" stroke="none" stroke-width="0"/><text x="828" y="477.25" fill="#087F7A" font-family="Microsoft YaHei" font-size="18" font-weight="400" text-anchor="start">RenderWrite / RenderFrame</text><line x1="820" y1="558" x2="180" y2="558" stroke="#087F7A" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="189.00447102352678" y1="553.6503446588877" x2="180" y2="558" stroke="#087F7A" stroke-width="2.5" /><line x1="189.00447102352678" y1="562.3496553411123" x2="180" y2="558" stroke="#087F7A" stroke-width="2.5" /><rect x="330" y="520" width="470" height="34" fill="none" stroke="none" stroke-width="0"/><text x="330" y="545.25" fill="#087F7A" font-family="Microsoft YaHei" font-size="22" font-weight="400" text-anchor="start">写端完成后 atomic dflag--</text><line x1="180" y1="618" x2="500" y2="618" stroke="#3379EB" stroke-width="2.5" /><line x1="490.9955289764732" y1="622.3496553411123" x2="500" y2="618" stroke="#3379EB" stroke-width="2.5" /><line x1="490.9955289764732" y1="613.6503446588877" x2="500" y2="618" stroke="#3379EB" stroke-width="2.5" /><rect x="188" y="587" width="306" height="29" fill="none" stroke="none" stroke-width="0"/><text x="188" y="609" fill="#3379EB" font-family="Microsoft YaHei" font-size="20" font-weight="400" text-anchor="start">后续轮次才生成、投递 B</text><rect x="54" y="670" width="1080" height="29" fill="none" stroke="none" stroke-width="0"/><text x="54" y="690.125" fill="#526679" font-family="Microsoft YaHei" font-size="15" font-weight="400" text-anchor="start">5.1普通主输出的合法交错，不按耗时绘制；post传chunk引用，非此处整块PCM复制</text><rect x="1158" y="670" width="66" height="29" fill="none" stroke="none" stroke-width="0"/><text x="1224" y="691.25" fill="#526679" font-family="Microsoft YaHei" font-size="18" font-weight="400" text-anchor="end">02</text></svg>