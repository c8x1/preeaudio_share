<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#F8FAFD"/><rect x="54" y="21" width="1150" height="24" fill="none" stroke="none" stroke-width="0"/><text x="54" y="39" fill="#087F7A" font-family="Microsoft YaHei" font-size="16" font-weight="700" text-anchor="start">故事二 · 批次与所有权</text><rect x="54" y="62" width="1170" height="60" fill="none" stroke="none" stroke-width="0"/><text x="54" y="107.75" fill="#12263B" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="start">节点已经回收，为什么任务还没完成？</text><rect x="54" y="132" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="161.375" fill="#526679" font-family="Microsoft YaHei" font-size="25" font-weight="400" text-anchor="start">摘批分离新旧链；vector先接管闭包，节点和业务有不同生命周期</text><rect x="54" y="204" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="233.375" fill="#12263B" font-family="Microsoft YaHei" font-size="25" font-weight="700" text-anchor="start">① 摘批成功：全局头变空；此后 C 才发布到新的全局头</text><rect x="54" y="269" width="300" height="34" fill="none" stroke="none" stroke-width="0"/><text x="54" y="294.625" fill="#3379EB" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="start">全局入口：后续批次</text><rect x="440" y="269" width="510" height="34" fill="none" stroke="none" stroke-width="0"/><text x="440" y="294.625" fill="#087F7A" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="start">消费者持有的旧批次</text><rect x="1020" y="269" width="200" height="34" fill="none" stroke="none" stroke-width="0"/><text x="1020" y="294.625" fill="#526679" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="start">空闲节点链</text><rect x="100" y="330" width="175" height="60" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="110" y="335" width="155" height="50" fill="none" stroke="none" stroke-width="0"/><text x="187.5" y="369.375" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="25" font-weight="700" text-anchor="middle">C → ∅</text><rect x="465" y="330" width="140" height="60" fill="#087F7A" stroke="none" stroke-width="0"/><rect x="475" y="335" width="120" height="50" fill="none" stroke="none" stroke-width="0"/><text x="535" y="369.375" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="25" font-weight="700" text-anchor="middle">B</text><rect x="690" y="330" width="140" height="60" fill="#087F7A" stroke="none" stroke-width="0"/><rect x="700" y="335" width="120" height="50" fill="none" stroke="none" stroke-width="0"/><text x="760" y="369.375" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="25" font-weight="700" text-anchor="middle">A</text><line x1="605" y1="360" x2="690" y2="360" stroke="#087F7A" stroke-width="2.5" /><line x1="680.9955289764732" y1="364.3496553411123" x2="690" y2="360" stroke="#087F7A" stroke-width="2.5" /><line x1="680.9955289764732" y1="355.6503446588877" x2="690" y2="360" stroke="#087F7A" stroke-width="2.5" /><line x1="650" y1="395" x2="650" y2="444" stroke="#087F7A" stroke-width="2.5" /><line x1="645.6503446588877" y1="434.9955289764732" x2="650" y2="444" stroke="#087F7A" stroke-width="2.5" /><line x1="654.3496553411123" y1="434.9955289764732" x2="650" y2="444" stroke="#087F7A" stroke-width="2.5" /><rect x="440" y="449" width="415" height="65" fill="#12263B" stroke="none" stroke-width="0"/><rect x="450" y="454" width="395" height="55" fill="none" stroke="none" stroke-width="0"/><text x="647.5" y="490.125" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="middle">② move闭包：vector=[B,A]</text><line x1="855" y1="481" x2="1035" y2="481" stroke="#526679" stroke-width="2.5" /><line x1="1025.9955289764732" y1="485.3496553411123" x2="1035" y2="481" stroke="#526679" stroke-width="2.5" /><line x1="1025.9955289764732" y1="476.6503446588877" x2="1035" y2="481" stroke="#526679" stroke-width="2.5" /><rect x="875" y="438" width="310" height="34" fill="none" stroke="none" stroke-width="0"/><text x="875" y="463.25" fill="#526679" font-family="Microsoft YaHei" font-size="22" font-weight="400" text-anchor="start">节点先回收</text><rect x="1035" y="451" width="180" height="62" fill="#526679" stroke="none" stroke-width="0"/><rect x="1045" y="456" width="160" height="52" fill="none" stroke="none" stroke-width="0"/><text x="1125" y="490.25" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">节点可复用</text><line x1="650" y1="514" x2="650" y2="554" stroke="#087F7A" stroke-width="2.5" /><line x1="645.6503446588877" y1="544.9955289764732" x2="650" y2="554" stroke="#087F7A" stroke-width="2.5" /><line x1="654.3496553411123" y1="544.9955289764732" x2="650" y2="554" stroke="#087F7A" stroke-width="2.5" /><rect x="440" y="564" width="750" height="40" fill="none" stroke="none" stroke-width="0"/><text x="440" y="593.375" fill="#087F7A" font-family="Microsoft YaHei" font-size="25" font-weight="700" text-anchor="start">③ 反向调用闭包：A 再 B；此时业务才执行</text><rect x="54" y="424" width="295" height="110" fill="none" stroke="none" stroke-width="0"/><text x="54" y="458" fill="#3379EB" font-family="Microsoft YaHei" font-size="24" font-weight="400" text-anchor="start">C 留待后批</text><text x="54" y="488" fill="#3379EB" font-family="Microsoft YaHei" font-size="24" font-weight="400" text-anchor="start">不加入正在遍历</text><text x="54" y="518" fill="#3379EB" font-family="Microsoft YaHei" font-size="24" font-weight="400" text-anchor="start">的私有旧链</text><rect x="54" y="620" width="1170" height="34" fill="none" stroke="none" stroke-width="0"/><text x="54" y="644.5" fill="#12263B" font-family="Microsoft YaHei" font-size="20" font-weight="700" text-anchor="start">入口头空 ≠ 业务完成；1000初始 / 90%扩容检查 / 5000上限，耗尽仍会报告并丢请求</text><rect x="54" y="670" width="1080" height="29" fill="none" stroke="none" stroke-width="0"/><text x="54" y="690.125" fill="#526679" font-family="Microsoft YaHei" font-size="15" font-weight="400" text-anchor="start">教学条件：C成功发布发生在本批CAS摘取之后；常规节点复用不替代业务完成确认</text><rect x="1158" y="670" width="66" height="29" fill="none" stroke="none" stroke-width="0"/><text x="1224" y="691.25" fill="#526679" font-family="Microsoft YaHei" font-size="18" font-weight="400" text-anchor="end">07</text></svg>