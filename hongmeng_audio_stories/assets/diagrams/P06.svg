<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#F8FAFD"/><rect x="54" y="21" width="1150" height="24" fill="none" stroke="none" stroke-width="0"/><text x="54" y="39" fill="#087F7A" font-family="Microsoft YaHei" font-size="16" font-weight="700" text-anchor="start">故事二 · CAS竞争推演</text><rect x="54" y="62" width="1170" height="60" fill="none" stroke="none" stroke-width="0"/><text x="54" y="107.75" fill="#12263B" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="start">B 的 CAS 失败以后，只重试够不够？</text><rect x="54" y="132" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="161.375" fill="#526679" font-family="Microsoft YaHei" font-size="25" font-weight="400" text-anchor="start">每次重试都重读表头、重建next，才能保住先前已发布的链</text><rect x="54" y="213" width="75" height="50" fill="#12263B" stroke="#DBE4EE"/><text x="66" y="244" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">步</text><rect x="129" y="213" width="325" height="50" fill="#12263B" stroke="#DBE4EE"/><text x="141" y="244" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">生产者甲：A</text><rect x="454" y="213" width="440" height="50" fill="#12263B" stroke="#DBE4EE"/><text x="466" y="244" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">生产者乙：B</text><rect x="894" y="213" width="330" height="50" fill="#12263B" stroke="#DBE4EE"/><text x="906" y="244" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">全局待处理链</text><rect x="54" y="263" width="75" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="294" fill="#12263B" font-family="Microsoft YaHei" font-size="21">1</text><rect x="129" y="263" width="325" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="141" y="294" fill="#12263B" font-family="Microsoft YaHei" font-size="21">填闭包A</text><rect x="454" y="263" width="440" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="466" y="294" fill="#12263B" font-family="Microsoft YaHei" font-size="21">填闭包B</text><rect x="894" y="263" width="330" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="906" y="294" fill="#12263B" font-family="Microsoft YaHei" font-size="21">∅</text><rect x="54" y="313" width="75" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="66" y="344" fill="#12263B" font-family="Microsoft YaHei" font-size="21">2</text><rect x="129" y="313" width="325" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="141" y="344" fill="#12263B" font-family="Microsoft YaHei" font-size="21">读头∅；A.next=∅</text><rect x="454" y="313" width="440" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="466" y="344" fill="#12263B" font-family="Microsoft YaHei" font-size="21">读头∅；B.next=∅</text><rect x="894" y="313" width="330" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="906" y="344" fill="#12263B" font-family="Microsoft YaHei" font-size="21">∅</text><rect x="54" y="363" width="75" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="394" fill="#12263B" font-family="Microsoft YaHei" font-size="21">3</text><rect x="129" y="363" width="325" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="141" y="394" fill="#12263B" font-family="Microsoft YaHei" font-size="21">CAS(∅→A)成功</text><rect x="454" y="363" width="440" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="466" y="394" fill="#12263B" font-family="Microsoft YaHei" font-size="21">尚未CAS</text><rect x="894" y="363" width="330" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="906" y="394" fill="#12263B" font-family="Microsoft YaHei" font-size="21">A → ∅</text><rect x="54" y="413" width="75" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="66" y="444" fill="#12263B" font-family="Microsoft YaHei" font-size="21">4</text><rect x="129" y="413" width="325" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="141" y="444" fill="#12263B" font-family="Microsoft YaHei" font-size="21">已发布</text><rect x="454" y="413" width="440" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="466" y="444" fill="#12263B" font-family="Microsoft YaHei" font-size="21">CAS(∅→B)失败</text><rect x="894" y="413" width="330" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="906" y="444" fill="#12263B" font-family="Microsoft YaHei" font-size="21">A → ∅</text><rect x="54" y="463" width="75" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="494" fill="#12263B" font-family="Microsoft YaHei" font-size="21">5</text><rect x="129" y="463" width="325" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="141" y="494" fill="#12263B" font-family="Microsoft YaHei" font-size="21">—</text><rect x="454" y="463" width="440" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="466" y="494" fill="#12263B" font-family="Microsoft YaHei" font-size="21">重读A；改B.next=A</text><rect x="894" y="463" width="330" height="50" fill="#FFFFFF" stroke="#DBE4EE"/><text x="906" y="494" fill="#12263B" font-family="Microsoft YaHei" font-size="21">A → ∅</text><rect x="54" y="513" width="75" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="66" y="544" fill="#12263B" font-family="Microsoft YaHei" font-size="21">6</text><rect x="129" y="513" width="325" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="141" y="544" fill="#12263B" font-family="Microsoft YaHei" font-size="21">—</text><rect x="454" y="513" width="440" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="466" y="544" fill="#12263B" font-family="Microsoft YaHei" font-size="21">CAS(A→B)成功</text><rect x="894" y="513" width="330" height="50" fill="#EFF4FA" stroke="#DBE4EE"/><text x="906" y="544" fill="#12263B" font-family="Microsoft YaHei" font-size="21">B → A → ∅</text><rect x="54" y="581" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="610.375" fill="#B96320" font-family="Microsoft YaHei" font-size="25" font-weight="700" text-anchor="start">若只重试CAS而不改next：B → ∅，已经发布的 A 会从请求链上脱落</text><rect x="54" y="631" width="1170" height="30" fill="none" stroke="none" stroke-width="0"/><text x="54" y="654.25" fill="#12263B" font-family="Microsoft YaHei" font-size="22" font-weight="400" text-anchor="start">头值还含32位flag与32位index；复用携带版本信息，详见A3</text><rect x="54" y="670" width="1080" height="29" fill="none" stroke="none" stroke-width="0"/><text x="54" y="690.125" fill="#526679" font-family="Microsoft YaHei" font-size="15" font-weight="400" text-anchor="start">A/B为独立请求的教学竞争；先后指CAS成功发布次序，不是外部调用起始次序</text><rect x="1158" y="670" width="66" height="29" fill="none" stroke="none" stroke-width="0"/><text x="1224" y="691.25" fill="#526679" font-family="Microsoft YaHei" font-size="18" font-weight="400" text-anchor="end">06</text></svg>