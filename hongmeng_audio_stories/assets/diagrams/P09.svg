<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#F8FAFD"/><rect x="54" y="21" width="1150" height="24" fill="none" stroke="none" stroke-width="0"/><text x="54" y="39" fill="#087F7A" font-family="Microsoft YaHei" font-size="16" font-weight="700" text-anchor="start">故事二 · 迟到事件竞态</text><rect x="54" y="62" width="1170" height="60" fill="none" stroke="none" stroke-width="0"/><text x="54" y="107.75" fill="#12263B" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="start">迟到的 FadeDone，能拆掉刚恢复的通路吗？</text><rect x="54" y="132" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="161.375" fill="#526679" font-family="Microsoft YaHei" font-size="25" font-weight="400" text-anchor="start">正确排队仍不足够：真正改状态之前，必须再检查当前条件</text><rect x="54" y="210" width="245" height="58.333333333333336" fill="#12263B" stroke="#DBE4EE"/><text x="66" y="241" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">轮次 / 上下文</text><rect x="299" y="210" width="485" height="58.333333333333336" fill="#12263B" stroke="#DBE4EE"/><text x="311" y="241" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">实际发生的工作</text><rect x="784" y="210" width="440" height="58.333333333333336" fill="#12263B" stroke="#DBE4EE"/><text x="796" y="241" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">请求链 / 输入状态</text><rect x="54" y="268.3333333333333" width="245" height="58.333333333333336" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="299.3333333333333" fill="#12263B" font-family="Microsoft YaHei" font-size="21">N · HandleMsg</text><rect x="299" y="268.3333333333333" width="485" height="58.333333333333336" fill="#FFFFFF" stroke="#DBE4EE"/><text x="311" y="299.3333333333333" fill="#12263B" font-family="Microsoft YaHei" font-size="21">Pause已被执行；进入PAUSING</text><rect x="784" y="268.3333333333333" width="440" height="58.333333333333336" fill="#FFFFFF" stroke="#DBE4EE"/><text x="796" y="299.3333333333333" fill="#12263B" font-family="Microsoft YaHei" font-size="21">本批已摘走；随后进入Process</text><rect x="54" y="326.66666666666663" width="245" height="58.333333333333336" fill="#EFF4FA" stroke="#DBE4EE"/><text x="66" y="357.66666666666663" fill="#12263B" font-family="Microsoft YaHei" font-size="21">N · Process期间</text><rect x="299" y="326.66666666666663" width="485" height="58.333333333333336" fill="#EFF4FA" stroke="#DBE4EE"/><text x="311" y="357.66666666666663" fill="#12263B" font-family="Microsoft YaHei" font-size="21">另一个线程先成功发布Start</text><rect x="784" y="326.66666666666663" width="440" height="58.333333333333336" fill="#EFF4FA" stroke="#DBE4EE"/><text x="796" y="357.66666666666663" fill="#12263B" font-family="Microsoft YaHei" font-size="21">全局：Start → ∅</text><rect x="54" y="384.99999999999994" width="245" height="58.333333333333336" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="415.99999999999994" fill="#12263B" font-family="Microsoft YaHei" font-size="21">N · Gain继续处理</text><rect x="299" y="384.99999999999994" width="485" height="58.333333333333336" fill="#FFFFFF" stroke="#DBE4EE"/><text x="311" y="415.99999999999994" fill="#12263B" font-family="Microsoft YaHei" font-size="21">淡出完成；OnFadeDone发布F</text><rect x="784" y="384.99999999999994" width="440" height="58.333333333333336" fill="#FFFFFF" stroke="#DBE4EE"/><text x="796" y="415.99999999999994" fill="#12263B" font-family="Microsoft YaHei" font-size="21">全局：F → Start → ∅</text><rect x="54" y="443.33333333333326" width="245" height="58.333333333333336" fill="#EFF4FA" stroke="#DBE4EE"/><text x="66" y="474.33333333333326" fill="#12263B" font-family="Microsoft YaHei" font-size="21">N+1 · HandleMsg</text><rect x="299" y="443.33333333333326" width="485" height="58.333333333333336" fill="#EFF4FA" stroke="#DBE4EE"/><text x="311" y="474.33333333333326" fill="#12263B" font-family="Microsoft YaHei" font-size="21">摘批后反向调用：先Start</text><rect x="784" y="443.33333333333326" width="440" height="58.333333333333336" fill="#EFF4FA" stroke="#DBE4EE"/><text x="796" y="474.33333333333326" fill="#12263B" font-family="Microsoft YaHei" font-size="21">输入改为RUNNING并恢复连接</text><rect x="54" y="501.6666666666666" width="245" height="58.333333333333336" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="532.6666666666665" fill="#12263B" font-family="Microsoft YaHei" font-size="21">N+1 · 随后的F</text><rect x="299" y="501.6666666666666" width="485" height="58.333333333333336" fill="#FFFFFF" stroke="#DBE4EE"/><text x="311" y="532.6666666666665" fill="#12263B" font-family="Microsoft YaHei" font-size="21">闭包内部再读当前状态</text><rect x="784" y="501.6666666666666" width="440" height="58.333333333333336" fill="#FFFFFF" stroke="#DBE4EE"/><text x="796" y="532.6666666666665" fill="#12263B" font-family="Microsoft YaHei" font-size="21">RUNNING：直接返回，不拆图</text><rect x="54" y="579" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="608" fill="#B96320" font-family="Microsoft YaHei" font-size="24" font-weight="700" text-anchor="start">反事实：去掉执行时guard，旧F会暂停音效、拆掉新连接、回写PAUSED</text><rect x="54" y="625" width="1170" height="30" fill="none" stroke="none" stroke-width="0"/><text x="54" y="647.875" fill="#12263B" font-family="Microsoft YaHei" font-size="21" font-weight="400" text-anchor="start">同批Pause→Start可能重置淡出而不产生旧F；此guard也没有暂停代次令牌</text><rect x="54" y="670" width="1080" height="29" fill="none" stroke="none" stroke-width="0"/><text x="54" y="690.125" fill="#526679" font-family="Microsoft YaHei" font-size="15" font-weight="400" text-anchor="start">教学合法交错：N轮Pause已执行，Process期间先发布Start再发布F；不是每次Pause/Start都产生旧F</text><rect x="1158" y="670" width="66" height="29" fill="none" stroke="none" stroke-width="0"/><text x="1224" y="691.25" fill="#526679" font-family="Microsoft YaHei" font-size="18" font-weight="400" text-anchor="end">09</text></svg>