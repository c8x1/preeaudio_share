<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#F8FAFD"/><rect x="54" y="21" width="1150" height="24" fill="none" stroke="none" stroke-width="0"/><text x="54" y="39" fill="#087F7A" font-family="Microsoft YaHei" font-size="16" font-weight="700" text-anchor="start">故事三 · 策略选择真实分支</text><rect x="54" y="62" width="1170" height="60" fill="none" stroke="none" stroke-width="0"/><text x="54" y="107.75" fill="#12263B" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="start">新耳机为什么可能获胜，也可能轮不到它？</text><rect x="54" y="132" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="161.375" fill="#526679" font-family="Microsoft YaHei" font-size="25" font-weight="400" text-anchor="start">Router优先级与Router内部的候选排序，是两层不同规则</text><rect x="54" y="206" width="1170" height="36" fill="none" stroke="none" stroke-width="0"/><text x="54" y="232.625" fill="#12263B" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="start">本次条件：zone0普通音乐，仓库默认XML，无后续refiner改写；先选有效设备</text><rect x="54" y="264" width="180" height="62" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="64" y="269" width="160" height="52" fill="none" stroke="none" stroke-width="0"/><text x="144" y="302.875" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21" font-weight="700" text-anchor="middle">UserSelect</text><line x1="234" y1="295" x2="252" y2="295" stroke="#3379EB" stroke-width="2.5" /><line x1="242.99552897647322" y1="299.3496553411123" x2="252" y2="295" stroke="#3379EB" stroke-width="2.5" /><line x1="242.99552897647322" y1="290.6503446588877" x2="252" y2="295" stroke="#3379EB" stroke-width="2.5" /><rect x="252" y="264" width="180" height="62" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="262" y="269" width="160" height="52" fill="none" stroke="none" stroke-width="0"/><text x="342" y="302.875" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21" font-weight="700" text-anchor="middle">PairDevice</text><line x1="432" y1="295" x2="450" y2="295" stroke="#3379EB" stroke-width="2.5" /><line x1="440.9955289764732" y1="299.3496553411123" x2="450" y2="295" stroke="#3379EB" stroke-width="2.5" /><line x1="440.9955289764732" y1="290.6503446588877" x2="450" y2="295" stroke="#3379EB" stroke-width="2.5" /><rect x="450" y="264" width="180" height="62" fill="#087F7A" stroke="none" stroke-width="0"/><rect x="460" y="269" width="160" height="52" fill="none" stroke="none" stroke-width="0"/><text x="540" y="302.875" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21" font-weight="700" text-anchor="middle">Privacy</text><line x1="630" y1="295" x2="648" y2="295" stroke="#3379EB" stroke-width="2.5" /><line x1="638.9955289764732" y1="299.3496553411123" x2="648" y2="295" stroke="#3379EB" stroke-width="2.5" /><line x1="638.9955289764732" y1="290.6503446588877" x2="648" y2="295" stroke="#3379EB" stroke-width="2.5" /><rect x="648" y="264" width="180" height="62" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="658" y="269" width="160" height="52" fill="none" stroke="none" stroke-width="0"/><text x="738" y="302.875" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21" font-weight="700" text-anchor="middle">Public</text><line x1="828" y1="295" x2="846" y2="295" stroke="#3379EB" stroke-width="2.5" /><line x1="836.9955289764732" y1="299.3496553411123" x2="846" y2="295" stroke="#3379EB" stroke-width="2.5" /><line x1="836.9955289764732" y1="290.6503446588877" x2="846" y2="295" stroke="#3379EB" stroke-width="2.5" /><rect x="846" y="264" width="180" height="62" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="856" y="269" width="160" height="52" fill="none" stroke="none" stroke-width="0"/><text x="936" y="302.875" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21" font-weight="700" text-anchor="middle">StreamFilter</text><line x1="1026" y1="295" x2="1044" y2="295" stroke="#3379EB" stroke-width="2.5" /><line x1="1034.9955289764732" y1="299.3496553411123" x2="1044" y2="295" stroke="#3379EB" stroke-width="2.5" /><line x1="1034.9955289764732" y1="290.6503446588877" x2="1044" y2="295" stroke="#3379EB" stroke-width="2.5" /><rect x="1044" y="264" width="180" height="62" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="1054" y="269" width="160" height="52" fill="none" stroke="none" stroke-width="0"/><text x="1134" y="302.875" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21" font-weight="700" text-anchor="middle">Default</text><rect x="54" y="344" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="373.375" fill="#3379EB" font-family="Microsoft YaHei" font-size="25" font-weight="700" text-anchor="start">Router间：第一个有效结果就返回，后面的Router不再参与</text><rect x="54" y="404" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="432.625" fill="#087F7A" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="start">Privacy内部：候选 → 过滤禁用 / 异常 / 排除项 → 合格列表中选最新连接</text><rect x="54" y="475" width="430" height="55" fill="#12263B" stroke="#DBE4EE"/><text x="66" y="506" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">改变一个条件</text><rect x="484" y="475" width="740" height="55" fill="#12263B" stroke="#DBE4EE"/><text x="496" y="506" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="21">预测结果</text><rect x="54" y="530" width="430" height="55" fill="#FFFFFF" stroke="#DBE4EE"/><text x="66" y="561" fill="#12263B" font-family="Microsoft YaHei" font-size="21">UserSelect仍返回有效扬声器</text><rect x="484" y="530" width="740" height="55" fill="#FFFFFF" stroke="#DBE4EE"/><text x="496" y="561" fill="#12263B" font-family="Microsoft YaHei" font-size="21">立即返回扬声器；更新的耳机轮不到Privacy来覆盖</text><rect x="54" y="585" width="430" height="55" fill="#EFF4FA" stroke="#DBE4EE"/><text x="66" y="616" fill="#12263B" font-family="Microsoft YaHei" font-size="21">前方无结果，最新Privacy设备被禁用</text><rect x="484" y="585" width="740" height="55" fill="#EFF4FA" stroke="#DBE4EE"/><text x="496" y="616" fill="#12263B" font-family="Microsoft YaHei" font-size="21">先排除它，再从合格候选中选；时间最新不能豁免过滤</text><rect x="54" y="670" width="1080" height="29" fill="none" stroke="none" stroke-width="0"/><text x="54" y="690.125" fill="#526679" font-family="Microsoft YaHei" font-size="15" font-weight="400" text-anchor="start">限定zone0默认配置；非零zone可提前返回；产品XML可覆盖；Default先查上下文，不总是写死扬声器</text><rect x="1158" y="670" width="66" height="29" fill="none" stroke="none" stroke-width="0"/><text x="1224" y="691.25" fill="#526679" font-family="Microsoft YaHei" font-size="18" font-weight="400" text-anchor="end">10</text></svg>