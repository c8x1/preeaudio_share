<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#F8FAFD"/><rect x="54" y="21" width="1150" height="24" fill="none" stroke="none" stroke-width="0"/><text x="54" y="39" fill="#087F7A" font-family="Microsoft YaHei" font-size="16" font-weight="700" text-anchor="start">故事一 · 执行组织的取舍</text><rect x="54" y="62" width="1170" height="60" fill="none" stroke="none" stroke-width="0"/><text x="54" y="107.75" fill="#12263B" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="start">线程合并以后，Pause 在哪里等？</text><rect x="54" y="132" width="1170" height="40" fill="none" stroke="none" stroke-width="0"/><text x="54" y="161.375" fill="#526679" font-family="Microsoft YaHei" font-size="25" font-weight="400" text-anchor="start">Notify 唤醒等待，不会抢占正在执行的 RenderFrame</text><rect x="54" y="207" width="1170" height="36" fill="none" stroke="none" stroke-width="0"/><text x="54" y="234" fill="#12263B" font-family="Microsoft YaHei" font-size="24" font-weight="700" text-anchor="start">设备处理线程：函数执行顺序，不按真实耗时缩放</text><rect x="54" y="285" width="230" height="78" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="64" y="290" width="210" height="68" fill="none" stroke="none" stroke-width="0"/><text x="169" y="333.75" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="26" font-weight="700" text-anchor="middle">HandleMsg</text><rect x="316" y="285" width="635" height="78" fill="#087F7A" stroke="none" stroke-width="0"/><rect x="326" y="290" width="615" height="68" fill="none" stroke="none" stroke-width="0"/><text x="633.5" y="332.625" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="middle">Process：拉图 → SinkOutput → RenderFrame</text><rect x="984" y="285" width="240" height="78" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="994" y="290" width="220" height="68" fill="none" stroke="none" stroke-width="0"/><text x="1104" y="332.625" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="23" font-weight="700" text-anchor="middle">下一轮 HandleMsg</text><line x1="284" y1="325" x2="316" y2="325" stroke="#3379EB" stroke-width="2.5" /><line x1="306.9955289764732" y1="329.3496553411123" x2="316" y2="325" stroke="#3379EB" stroke-width="2.5" /><line x1="306.9955289764732" y1="320.6503446588877" x2="316" y2="325" stroke="#3379EB" stroke-width="2.5" /><line x1="951" y1="325" x2="984" y2="325" stroke="#3379EB" stroke-width="2.5" /><line x1="974.9955289764732" y1="329.3496553411123" x2="984" y2="325" stroke="#3379EB" stroke-width="2.5" /><line x1="974.9955289764732" y1="320.6503446588877" x2="984" y2="325" stroke="#3379EB" stroke-width="2.5" /><rect x="600" y="394" width="585" height="37" fill="none" stroke="none" stroke-width="0"/><text x="600" y="421.875" fill="#087F7A" font-family="Microsoft YaHei" font-size="25" font-weight="700" text-anchor="start">RenderFrame 尚未返回</text><rect x="575" y="464" width="295" height="80" fill="#B96320" stroke="none" stroke-width="0"/><rect x="585" y="469" width="275" height="70" fill="none" stroke="none" stroke-width="0"/><text x="722.5" y="498.5" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">控制侧另一线程</text><text x="722.5" y="526" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="22" font-weight="700" text-anchor="middle">发布Pause / Notify</text><line x1="870" y1="504" x2="1104" y2="504" stroke="#B96320" stroke-width="2.5" /><line x1="1094.9955289764732" y1="508.3496553411123" x2="1104" y2="504" stroke="#B96320" stroke-width="2.5" /><line x1="1094.9955289764732" y1="499.6503446588877" x2="1104" y2="504" stroke="#B96320" stroke-width="2.5" /><rect x="878" y="454" width="310" height="35" fill="none" stroke="none" stroke-width="0"/><text x="878" y="479.75" fill="#B96320" font-family="Microsoft YaHei" font-size="22" font-weight="400" text-anchor="start">留待后续消费</text><line x1="1104" y1="364" x2="1104" y2="445" stroke="#3379EB" stroke-width="2" stroke-dasharray="7 5"/><rect x="54" y="570" width="1170" height="45" fill="none" stroke="none" stroke-width="0"/><text x="54" y="602.625" fill="#12263B" font-family="Microsoft YaHei" font-size="27" font-weight="700" text-anchor="start">少一次跨线程中转；设备调用耗时也会占用这个控制执行上下文</text><rect x="54" y="670" width="1080" height="29" fill="none" stroke="none" stroke-width="0"/><text x="54" y="690.125" fill="#526679" font-family="Microsoft YaHei" font-size="15" font-weight="400" text-anchor="start">限定普通HPAE设备线程调用链；不声明驱动无其他线程，也不保证固定调度周期</text><rect x="1158" y="670" width="66" height="29" fill="none" stroke="none" stroke-width="0"/><text x="1224" y="691.25" fill="#526679" font-family="Microsoft YaHei" font-size="18" font-weight="400" text-anchor="end">03</text></svg>