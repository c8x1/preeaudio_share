<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">同一件事，写了几遍</text><rect x="64" y="136" width="1140" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="167.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">暂停恢复的淡入淡出，这一个保证，两边各写了几遍。</text><!-- reveal 1 --><rect x="64" y="200" width="560" height="380" fill="none" stroke="#62768A" stroke-width="2"/><rect x="84" y="214" width="520" height="35" fill="none" stroke="none" stroke-width="0"/><text x="84" y="240.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">PA · HDI sink 模块</text><rect x="84" y="254" width="520" height="30" fill="none" stroke="none" stroke-width="0"/><text x="84" y="276.875" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">单文件 4823 行 · 190 个函数</text><rect x="84" y="304" width="540" height="30" fill="none" stroke="none" stroke-width="0"/><text x="84" y="326.875" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="start">主通路：一套淡入完成检查</text><rect x="84" y="338" width="540" height="30" fill="none" stroke="none" stroke-width="0"/><text x="84" y="360.875" fill="#887798" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="start">多声道：又一套完成检查</text><rect x="84" y="372" width="540" height="30" fill="none" stroke="none" stroke-width="0"/><text x="84" y="394.875" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="start">低时延通路：专属一组处理</text><rect x="84" y="406" width="540" height="30" fill="none" stroke="none" stroke-width="0"/><text x="84" y="428.875" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="start">状态回调：按流类型 4 个变体</text><rect x="84" y="444" width="560" height="24" fill="none" stroke="none" stroke-width="0"/><text x="84" y="462.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">DoFading · CheckPrimaryFadeinIsDone</text><rect x="84" y="470" width="560" height="24" fill="none" stroke="none" stroke-width="0"/><text x="84" y="488.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">CheckMultiChannelFadeinIsDone · 状态回调 ×4</text><rect x="84" y="504" width="540" height="56" fill="none" stroke="none" stroke-width="0"/><text x="84" y="527.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">同文件还装着：设备开关、格式转换 ×8、限幅器、</text><text x="84" y="551" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">缓冲管理、静音检测、内录、会话策略</text><!-- reveal 2 --><rect x="656" y="200" width="560" height="380" fill="none" stroke="#119A92" stroke-width="2"/><rect x="676" y="214" width="520" height="35" fill="none" stroke="none" stroke-width="0"/><text x="676" y="240.5" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">HPAE · 增益节点</text><rect x="676" y="254" width="520" height="30" fill="none" stroke="none" stroke-width="0"/><text x="676" y="276.875" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">单节点 521 行 · 一套状态机</text><rect x="676" y="296" width="220" height="52" fill="#119A92" stroke="none" stroke-width="0"/><rect x="688" y="302" width="196" height="40" fill="none" stroke="none" stroke-width="0"/><text x="786" y="330.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">增益节点</text><rect x="916" y="300" width="290" height="48" fill="none" stroke="none" stroke-width="0"/><text x="916" y="319.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">挂标志 → 逐帧执行</text><text x="916" y="343" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">→ 就地回调</text><rect x="676" y="368" width="520" height="30" fill="none" stroke="none" stroke-width="0"/><text x="676" y="390.875" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">主通路 / 多声道 / 低时延：同一个节点</text><rect x="676" y="400" width="520" height="30" fill="none" stroke="none" stroke-width="0"/><text x="676" y="422.875" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">差异只是挂哪条链——挂链时的参数</text><rect x="676" y="444" width="520" height="52" fill="none" stroke="none" stroke-width="0"/><text x="676" y="465.25" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">节点层 32 个文件，一文件一职责；</text><text x="676" y="489" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">每个节点带独立单测</text><rect x="64" y="614" width="1140" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="643.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">流类型的差异：PA 织进每个关注点的代码分叉，HPAE 是挂链时的一个参数。</text><!-- reveal 0 --><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">左为旧方案单模块，右为新引擎节点层；行号与文件见讲稿附录。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">01</text></svg>