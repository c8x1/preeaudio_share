<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">改动半径：加限幅，接新设备</text><rect x="64" y="136" width="1140" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="167.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">两类常见改动，各自要碰多大面积。</text><!-- reveal 1 --><rect x="64" y="198" width="300" height="35" fill="none" stroke="none" stroke-width="0"/><text x="64" y="224.875" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">给所有通路加限幅</text><rect x="64" y="246" width="540" height="62" fill="#62768A" stroke="none" stroke-width="0"/><rect x="76" y="252" width="516" height="50" fill="none" stroke="none" stroke-width="0"/><text x="334" y="285.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">PA：限幅器长在 sink 文件里</text><rect x="64" y="318" width="540" height="28" fill="none" stroke="none" stroke-width="0"/><text x="64" y="339.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">加一个效果，动的是那个 4823 行的文件</text><rect x="656" y="246" width="540" height="62" fill="#119A92" stroke="none" stroke-width="0"/><rect x="668" y="252" width="516" height="50" fill="none" stroke="none" stroke-width="0"/><text x="926" y="285.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">HPAE：挂一个限幅节点进链</text><rect x="656" y="318" width="540" height="28" fill="none" stroke="none" stroke-width="0"/><text x="656" y="339.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">独立文件、独立单测，不碰别的节点</text><!-- reveal 2 --><rect x="64" y="406" width="300" height="35" fill="none" stroke="none" stroke-width="0"/><text x="64" y="432.875" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">接一种新输出设备</text><rect x="64" y="454" width="540" height="62" fill="#62768A" stroke="none" stroke-width="0"/><rect x="76" y="460" width="516" height="50" fill="none" stroke="none" stroke-width="0"/><text x="334" y="492.875" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="middle">PA：动 sink 的设备分支与格式转换</text><rect x="64" y="526" width="540" height="28" fill="none" stroke="none" stroke-width="0"/><text x="64" y="547.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">设备差异写进模块代码</text><rect x="656" y="454" width="540" height="62" fill="#119A92" stroke="none" stroke-width="0"/><rect x="668" y="460" width="516" height="50" fill="none" stroke="none" stroke-width="0"/><text x="926" y="492.875" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="middle">HPAE：节点信息按目标侧填参数</text><rect x="656" y="526" width="540" height="28" fill="none" stroke="none" stroke-width="0"/><text x="656" y="547.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">帧长采样率来自目标，节点不改</text><rect x="64" y="614" width="1140" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="643.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">PA 把流类型与设备差异写成代码分叉；HPAE 把它们变成挂链时的参数。</text><!-- reveal 0 --><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">情景为结构对照；具体行号见讲稿附录。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">02</text></svg>