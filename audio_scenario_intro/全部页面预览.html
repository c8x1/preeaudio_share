xt x="64" y="611" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">恢复要平顺，旧的暂停操作也不能把它再次停掉。</text></g><g data-stage="0"><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">普通淡出路径示意。操作交错需结合当前状态处理。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">02</text></g></svg></section><section data-step="0" data-max="2"><div class="bar"><strong>03　切到耳机，为什么不只是换个出口？</strong><span class="progress"></span><button data-action="prev">上一步</button><button data-action="next">下一步</button><button data-action="all">全部展开</button></div><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g data-stage="0"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">切到耳机，为什么不只是换个出口？</text><rect x="64" y="143" width="1140" height="43" fill="none" stroke="none" stroke-width="0"/><text x="64" y="175" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">同一路音乐，从扬声器切到耳机。</text><rect x="64" y="220" width="480" height="34" fill="none" stroke="none" stroke-width="0"/><text x="64" y="246" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">底层要做的事</text><rect x="665" y="220" width="540" height="34" fill="none" stroke="none" stroke-width="0"/><text x="665" y="246" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weigh
