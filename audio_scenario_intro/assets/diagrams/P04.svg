<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">这些事情，还得在播放过程中完成</text><rect x="64" y="143" width="1140" height="43" fill="none" stroke="none" stroke-width="0"/><text x="64" y="175" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">需要继续播放时，设备不能一直等控制操作处理完。</text><rect x="64" y="240" width="180" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="270.125" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">控制动作</text><rect x="312" y="233" width="220" height="48" fill="none" stroke="none" stroke-width="0"/><text x="422" y="267.875" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="middle">暂停</text><rect x="610" y="233" width="220" height="48" fill="none" stroke="none" stroke-width="0"/><text x="720" y="267.875" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="middle">恢复</text><rect x="908" y="233" width="220" height="48" fill="none" stroke="none" stroke-width="0"/><text x="1018" y="267.875" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="middle">切耳机</text><line x1="300" y1="297" x2="374.5833333333333" y2="297" stroke="#3379EB" stroke-width="2"/><line x1="449.16666666666663" y1="297" x2="523.75" y2="297" stroke="#3379EB" stroke-width="2"/><line x1="598.3333333333333" y1="297" x2="672.9166666666667" y2="297" stroke="#3379EB" stroke-width="2"/><line x1="747.5" y1="297" x2="822.0833333333334" y2="297" stroke="#3379EB" stroke-width="2"/><line x1="896.6666666666666" y1="297" x2="971.25" y2="297" stroke="#3379EB" stroke-width="2"/><line x1="1045.8333333333335" y1="297" x2="1120.4166666666665" y2="297" stroke="#3379EB" stroke-width="2"/><line x1="1185.9955289764732" y1="301.3496553411123" x2="1195" y2="297" stroke="#3379EB" stroke-width="3"/><line x1="1185.9955289764732" y1="292.6503446588877" x2="1195" y2="297" stroke="#3379EB" stroke-width="3"/><rect x="64" y="351" width="180" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="381.125" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">音频数据</text><rect x="312" y="348" width="65" height="38" fill="#119A92" stroke="none" stroke-width="0"/><rect x="412" y="348" width="65" height="38" fill="#119A92" stroke="none" stroke-width="0"/><rect x="512" y="348" width="65" height="38" fill="#119A92" stroke="none" stroke-width="0"/><rect x="612" y="348" width="65" height="38" fill="#119A92" stroke="none" stroke-width="0"/><rect x="712" y="348" width="65" height="38" fill="#119A92" stroke="none" stroke-width="0"/><rect x="812" y="348" width="65" height="38" fill="#119A92" stroke="none" stroke-width="0"/><rect x="912" y="348" width="65" height="38" fill="#119A92" stroke="none" stroke-width="0"/><rect x="1012" y="348" width="65" height="38" fill="#119A92" stroke="none" stroke-width="0"/><rect x="1112" y="348" width="65" height="38" fill="#119A92" stroke="none" stroke-width="0"/><line x1="300" y1="412" x2="1195" y2="412" stroke="#119A92" stroke-width="3"/><line x1="1185.9955289764732" y1="416.3496553411123" x2="1195" y2="412" stroke="#119A92" stroke-width="3"/><line x1="1185.9955289764732" y1="407.6503446588877" x2="1195" y2="412" stroke="#119A92" stroke-width="3"/><!-- reveal 1 --><rect x="64" y="462" width="540" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="494.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">顺序要对：操作要符合当前状态</text><rect x="665" y="462" width="540" height="45" fill="none" stroke="none" stroke-width="0"/><text x="665" y="494.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">处理要及时：后续供数不能久等</text><!-- reveal 2 --><line x1="64" y1="540" x2="1214" y2="540" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="566" width="1140" height="45" fill="none" stroke="none" stroke-width="0"/><text x="64" y="600.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" text-anchor="start">谁执行控制？谁处理数据？设备变化时怎样配合？</text><rect x="64" y="622" width="1140" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="646.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">接下来，进入音频引擎的设计。</text><!-- reveal 0 --><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">控制与数据的职责示意，不表示同一路音乐暂停前后的连续时序。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">04</text></svg>