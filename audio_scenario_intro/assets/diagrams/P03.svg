<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">切到耳机，为什么不只是换个出口？</text><rect x="64" y="143" width="1140" height="43" fill="none" stroke="none" stroke-width="0"/><text x="64" y="175" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">同一路音乐，从扬声器切到耳机。</text><rect x="64" y="220" width="480" height="34" fill="none" stroke="none" stroke-width="0"/><text x="64" y="246" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">底层要做的事</text><rect x="665" y="220" width="540" height="34" fill="none" stroke="none" stroke-width="0"/><text x="665" y="246" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">为什么需要它</text><line x1="64" y1="272" x2="1214" y2="272" stroke="#DCE5EE" stroke-width="2"/><!-- reveal 1 --><rect x="64" y="296" width="555" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="327.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">确定目标设备</text><rect x="665" y="296" width="540" height="42" fill="none" stroke="none" stroke-width="0"/><text x="665" y="327.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">声音要送到选定的耳机</text><rect x="64" y="365" width="555" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="396.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">交接正在播放的这一路音乐</text><rect x="665" y="365" width="540" height="42" fill="none" stroke="none" stroke-width="0"/><text x="665" y="396.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">延续当前播放</text><!-- reveal 2 --><rect x="64" y="434" width="555" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="465.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">适配目标设备的数据要求</text><rect x="665" y="434" width="540" height="42" fill="none" stroke="none" stroke-width="0"/><text x="665" y="465.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">每轮需要的数据量可能不同</text><rect x="64" y="503" width="555" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="534.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">准备新处理链，完成旧链收尾</text><rect x="665" y="503" width="540" height="42" fill="none" stroke="none" stroke-width="0"/><text x="665" y="534.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">让声音能从目标设备输出</text><line x1="64" y1="568" x2="1214" y2="568" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="590" width="1140" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="625.25" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" text-anchor="start">这些衔接，都是为了让切换尽量连续、少些突变。</text><!-- reveal 0 --><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">策略侧选择设备，引擎执行迁移。具体衔接方式取决于设备与路径。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">03</text></svg>