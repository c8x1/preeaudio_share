<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="48" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="98.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">我们只做了三个动作</text><rect x="64" y="148" width="1120" height="44" fill="none" stroke="none" stroke-width="0"/><text x="64" y="180.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="start">手机正在放歌。我们暂停一下，继续播放，再切到耳机。</text><rect x="64" y="254" width="260" height="38" fill="none" stroke="none" stroke-width="0"/><text x="64" y="282.375" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="start">01</text><rect x="64" y="308" width="330" height="62" fill="none" stroke="none" stroke-width="0"/><text x="64" y="354.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">暂停</text><rect x="460" y="254" width="260" height="38" fill="none" stroke="none" stroke-width="0"/><text x="460" y="282.375" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="start">02</text><rect x="460" y="308" width="330" height="62" fill="none" stroke="none" stroke-width="0"/><text x="460" y="354.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">继续播放</text><rect x="856" y="254" width="260" height="38" fill="none" stroke="none" stroke-width="0"/><text x="856" y="282.375" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="start">03</text><rect x="856" y="308" width="330" height="62" fill="none" stroke="none" stroke-width="0"/><text x="856" y="354.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start">切到耳机</text><line x1="64" y1="402" x2="1214" y2="402" stroke="#DCE5EE" stroke-width="2"/><!-- reveal 1 --><rect x="64" y="437" width="330" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="473.375" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="700" text-anchor="start">停得干净</text><rect x="460" y="437" width="330" height="48" fill="none" stroke="none" stroke-width="0"/><text x="460" y="473.375" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="700" text-anchor="start">恢复自然</text><rect x="856" y="437" width="330" height="48" fill="none" stroke="none" stroke-width="0"/><text x="856" y="473.375" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="700" text-anchor="start">音乐接着放</text><!-- reveal 2 --><rect x="64" y="569" width="1140" height="65" fill="none" stroke="none" stroke-width="0"/><text x="64" y="615" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" text-anchor="start">按钮上没写的要求，底层都要考虑。</text><!-- reveal 0 --><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">这里先看用户期待，再看引擎需要处理的问题。</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">01</text></svg>