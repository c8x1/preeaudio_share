<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">源码设计 · 主讲</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="137" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" text-anchor="start">自研的技术价值，落在可验证的执行设计上</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">线程、消息和节点生命周期共同支撑底座演进</text><rect x="64" y="250" width="320" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="281.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">5.1 执行组织</text><rect x="470" y="250" width="365" height="42" fill="none" stroke="none" stroke-width="0"/><text x="470" y="281.125" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">当前自研执行组织</text><rect x="925" y="250" width="290" height="42" fill="none" stroke="none" stroke-width="0"/><text x="925" y="281.125" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">可定位的改变</text><line x1="64" y1="322" x2="1215" y2="322" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="330" width="365" height="54" fill="none" stroke="none" stroke-width="0"/><text x="64" y="365.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">render → dq → HDI写线程</text><rect x="470" y="330" width="410" height="54" fill="none" stroke="none" stroke-width="0"/><text x="470" y="365.25" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">同线程拉图后 RenderFrame</text><rect x="925" y="330" width="290" height="54" fill="none" stroke="none" stroke-width="0"/><text x="925" y="365.25" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">收拢线程交接</text><line x1="64" y1="394" x2="1215" y2="394" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="402" width="365" height="54" fill="none" stroke="none" stroke-width="0"/><text x="64" y="437.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">PaLockGuard + cork</text><rect x="470" y="402" width="410" height="54" fill="none" stroke="none" stroke-width="0"/><text x="470" y="437.25" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">CAS发布 + 消费侧执行</text><rect x="925" y="402" width="290" height="54" fill="none" stroke="none" stroke-width="0"/><text x="925" y="437.25" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">重组控制同步</text><line x1="64" y1="466" x2="1215" y2="466" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="474" width="365" height="54" fill="none" stroke="none" stroke-width="0"/><text x="64" y="509.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">专用hdi_sink处理路径</text><rect x="470" y="474" width="410" height="54" fill="none" stroke="none" stroke-width="0"/><text x="470" y="509.25" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">Node / Cluster 连接职责</text><rect x="925" y="474" width="290" height="54" fill="none" stroke="none" stroke-width="0"/><text x="925" y="509.25" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">复用转换与处理单元</text><line x1="64" y1="538" x2="1215" y2="538" stroke="#DCE5EE" stroke-width="2"/><rect x="64" y="546" width="365" height="54" fill="none" stroke="none" stroke-width="0"/><text x="64" y="581.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">PA操作回调管理状态</text><rect x="470" y="546" width="410" height="54" fill="none" stroke="none" stroke-width="0"/><text x="470" y="581.25" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">内部状态 + Gain完成回调</text><rect x="925" y="546" width="290" height="54" fill="none" stroke="none" stroke-width="0"/><text x="925" y="581.25" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">状态与节点生命周期衔接</text><rect x="64" y="624" width="1150" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="646.875" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="start">团队定性结果：时延降低、性能提升、功耗降低；量化幅度等待同口径产品数据</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">对照固定版本与具体路径；机制说明不替代产品指标</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">15</text></svg>