<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">源码设计 · 条件与边界</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="137" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" text-anchor="start">A3  一次 Pull：有结果就取，空队列才计算</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">OutputPort 的队列条件决定是否触发前驱节点处理</text><rect x="105" y="245" width="230" height="48" fill="none" stroke="none" stroke-width="0"/><text x="220" y="277.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">下游 InputPort</text><line x1="220" y1="300" x2="220" y2="600" stroke="#DCE5EE" stroke-width="2"/><rect x="525" y="245" width="230" height="48" fill="none" stroke="none" stroke-width="0"/><text x="640" y="277.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">前驱 OutputPort</text><line x1="640" y1="300" x2="640" y2="600" stroke="#DCE5EE" stroke-width="2"/><rect x="945" y="245" width="230" height="48" fill="none" stroke="none" stroke-width="0"/><text x="1060" y="277.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">前驱 Node</text><line x1="1060" y1="300" x2="1060" y2="600" stroke="#DCE5EE" stroke-width="2"/><line x1="220" y1="329" x2="640" y2="329" stroke="#3379EB" stroke-width="3"/><line x1="630.9955289764732" y1="333.3496553411123" x2="640" y2="329" stroke="#3379EB" stroke-width="3"/><line x1="630.9955289764732" y1="324.6503446588877" x2="640" y2="329" stroke="#3379EB" stroke-width="3"/><rect x="230" y="296" width="405" height="30" fill="none" stroke="none" stroke-width="0"/><text x="230" y="318.5" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">ReadPreOutputData → PullOutputData</text><rect x="662" y="369" width="535" height="35" fill="none" stroke="none" stroke-width="0"/><text x="662" y="394.75" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">if outputData_.empty()</text><line x1="640" y1="429" x2="1060" y2="429" stroke="#C97835" stroke-width="3"/><line x1="1050.9955289764732" y1="433.3496553411123" x2="1060" y2="429" stroke="#C97835" stroke-width="3"/><line x1="1050.9955289764732" y1="424.6503446588877" x2="1060" y2="429" stroke="#C97835" stroke-width="3"/><rect x="650" y="396" width="405" height="30" fill="none" stroke="none" stroke-width="0"/><text x="650" y="418.875" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">为空才调用 DoProcess()</text><line x1="1060" y1="493" x2="640" y2="493" stroke="#119A92" stroke-width="3"/><line x1="649.0044710235268" y1="488.6503446588877" x2="640" y2="493" stroke="#119A92" stroke-width="3"/><line x1="649.0044710235268" y1="497.3496553411123" x2="640" y2="493" stroke="#119A92" stroke-width="3"/><rect x="650" y="460" width="405" height="30" fill="none" stroke="none" stroke-width="0"/><text x="650" y="482.875" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">结果写入输出队列</text><line x1="640" y1="553" x2="220" y2="553" stroke="#119A92" stroke-width="3"/><line x1="229.00447102352678" y1="548.6503446588877" x2="220" y2="553" stroke="#119A92" stroke-width="3"/><line x1="229.00447102352678" y1="557.3496553411123" x2="220" y2="553" stroke="#119A92" stroke-width="3"/><rect x="230" y="520" width="405" height="30" fill="none" stroke="none" stroke-width="0"/><text x="230" y="542.875" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">取 back() 并 pop_back()</text><rect x="64" y="615" width="1150" height="39" fill="none" stroke="none" stroke-width="0"/><text x="64" y="642.375" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="start">队列已有结果时跳过 DoProcess；仍为空返回 nullptr，InputPort 只收集非空结果</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">橙色调用仅在空队列时发生；实际InputPort可有多个前驱</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">A3</text></svg>