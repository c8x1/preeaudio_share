<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">源码设计 · 主讲</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="137" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" text-anchor="start">新处理线程：消息与音频怎样共用执行循环</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">条件变量唤醒后先处理控制请求，再执行节点图</text><rect x="64" y="269" width="250" height="67" fill="#12263B" stroke="none" stroke-width="0"/><rect x="76" y="275" width="226" height="55" fill="none" stroke="none" stroke-width="0"/><text x="189" y="311.125" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">条件等待</text><rect x="360" y="269" width="250" height="67" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="372" y="275" width="226" height="55" fill="none" stroke="none" stroke-width="0"/><text x="485" y="311.125" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">HandleMsg()</text><rect x="656" y="269" width="250" height="67" fill="#119A92" stroke="none" stroke-width="0"/><rect x="668" y="275" width="226" height="55" fill="none" stroke="none" stroke-width="0"/><text x="781" y="311.125" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Process()</text><rect x="952" y="269" width="263" height="67" fill="#12263B" stroke="none" stroke-width="0"/><rect x="964" y="275" width="239" height="55" fill="none" stroke="none" stroke-width="0"/><text x="1083.5" y="311.125" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">下一轮 / 等待</text><line x1="314" y1="302" x2="360" y2="302" stroke="#3379EB" stroke-width="3"/><line x1="350.9955289764732" y1="306.3496553411123" x2="360" y2="302" stroke="#3379EB" stroke-width="3"/><line x1="350.9955289764732" y1="297.6503446588877" x2="360" y2="302" stroke="#3379EB" stroke-width="3"/><line x1="610" y1="302" x2="656" y2="302" stroke="#3379EB" stroke-width="3"/><line x1="646.9955289764732" y1="306.3496553411123" x2="656" y2="302" stroke="#3379EB" stroke-width="3"/><line x1="646.9955289764732" y1="297.6503446588877" x2="656" y2="302" stroke="#3379EB" stroke-width="3"/><line x1="906" y1="302" x2="952" y2="302" stroke="#3379EB" stroke-width="3"/><line x1="942.9955289764732" y1="306.3496553411123" x2="952" y2="302" stroke="#3379EB" stroke-width="3"/><line x1="942.9955289764732" y1="297.6503446588877" x2="952" y2="302" stroke="#3379EB" stroke-width="3"/><rect x="65" y="394" width="535" height="39" fill="none" stroke="none" stroke-width="0"/><text x="65" y="423.25" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">唤醒谓词（满足任一）</text><rect x="65" y="450" width="540" height="111" fill="none" stroke="none" stroke-width="0"/><text x="65" y="499.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="start">!running_  |  IsRunning()</text><text x="65" y="530.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="start">IsMsgProcessing()  |  recvSignal_</text><line x1="635" y1="390" x2="635" y2="580" stroke="#DCE5EE" stroke-width="2"/><rect x="685" y="394" width="530" height="39" fill="none" stroke="none" stroke-width="0"/><text x="685" y="423.25" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start">Notify() 仍有锁</text><rect x="685" y="452" width="530" height="107" fill="none" stroke="none" stroke-width="0"/><text x="685" y="499.25" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="start">持 mutex_ 设置 recvSignal_</text><text x="685" y="530.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="start">condition_.notify_all()</text><rect x="64" y="609" width="1140" height="39" fill="none" stroke="none" stroke-width="0"/><text x="64" y="636.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="start">没有固定 10ms tick；控制请求先 HandleMsg，随后才 Process 当前输出图</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">Run等待谓词含 IsRunning/IsMsgProcessing/recvSignal；Notify仍持mutex</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">07</text></svg>