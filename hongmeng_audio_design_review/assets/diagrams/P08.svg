<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">源码设计 · 主讲</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="137" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" text-anchor="start">Buffer 减在哪，仍保留在哪</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">删除旧线程中转，保留转换缓存与设备提交拼帧</text><rect x="64" y="269" width="270" height="60" fill="#12263B" stroke="none" stroke-width="0"/><rect x="76" y="275" width="246" height="48" fill="none" stroke="none" stroke-width="0"/><text x="199" y="307.625" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">共享缓冲供数</text><rect x="394" y="269" width="270" height="60" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="406" y="275" width="246" height="48" fill="none" stroke="none" stroke-width="0"/><text x="529" y="307.625" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Converter 缓存</text><rect x="724" y="269" width="270" height="60" fill="#119A92" stroke="none" stroke-width="0"/><rect x="736" y="275" width="246" height="48" fill="none" stroke="none" stroke-width="0"/><text x="859" y="307.625" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">SinkOutput 拼帧</text><rect x="1050" y="269" width="165" height="60" fill="#119A92" stroke="none" stroke-width="0"/><rect x="1062" y="275" width="141" height="48" fill="none" stroke="none" stroke-width="0"/><text x="1132.5" y="306.125" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="middle">RenderFrame</text><line x1="334" y1="299" x2="394" y2="299" stroke="#3379EB" stroke-width="3"/><line x1="384.9955289764732" y1="303.3496553411123" x2="394" y2="299" stroke="#3379EB" stroke-width="3"/><line x1="384.9955289764732" y1="294.6503446588877" x2="394" y2="299" stroke="#3379EB" stroke-width="3"/><line x1="664" y1="299" x2="724" y2="299" stroke="#3379EB" stroke-width="3"/><line x1="714.9955289764732" y1="303.3496553411123" x2="724" y2="299" stroke="#3379EB" stroke-width="3"/><line x1="714.9955289764732" y1="294.6503446588877" x2="724" y2="299" stroke="#3379EB" stroke-width="3"/><line x1="994" y1="299" x2="1050" y2="299" stroke="#3379EB" stroke-width="3"/><line x1="1040.9955289764732" y1="303.3496553411123" x2="1050" y2="299" stroke="#3379EB" stroke-width="3"/><line x1="1040.9955289764732" y1="294.6503446588877" x2="1050" y2="299" stroke="#3379EB" stroke-width="3"/><rect x="64" y="385" width="535" height="38" fill="none" stroke="none" stroke-width="0"/><text x="64" y="414.125" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">上游处理按需拉取</text><rect x="64" y="443" width="535" height="115" fill="none" stroke="none" stroke-width="0"/><text x="64" y="479.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">OutputPort 队列空才 DoProcess</text><text x="64" y="509.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">Converter 需已处理帧足够</text><text x="64" y="539.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">才可提取并消费缓存</text><line x1="636" y1="390" x2="636" y2="585" stroke="#DCE5EE" stroke-width="2"/><rect x="685" y="385" width="530" height="38" fill="none" stroke="none" stroke-width="0"/><text x="685" y="414.125" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">设备提交按块拼满</text><rect x="685" y="443" width="530" height="115" fill="none" stroke="none" stroke-width="0"/><text x="685" y="479.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">while currentSize_ &lt; renderSize_</text><text x="685" y="509.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">拉取 → 转换 → 累积字节</text><text x="685" y="539.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">拼满后调用 RenderFrame</text><rect x="64" y="611" width="1140" height="35" fill="none" stroke="none" stroke-width="0"/><text x="64" y="636.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="start">移除旧 primary.dq 中转；保留的缓存承担供数、格式适配和提交拼帧</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">静态源码解释缓存职责，不能证明端到端抗抖动等价</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">08</text></svg>