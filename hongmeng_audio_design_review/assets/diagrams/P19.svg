<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">源码设计 · 条件与边界</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="137" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" text-anchor="start">A4  迟到的 Drain 回调，怎样避免复活已停流</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">服务状态检查挡住过时完成事件，体现跨层异步正确性</text><rect x="105" y="245" width="230" height="48" fill="none" stroke="none" stroke-width="0"/><text x="220" y="277.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">客户端</text><line x1="220" y1="300" x2="220" y2="610" stroke="#DCE5EE" stroke-width="2"/><rect x="525" y="245" width="230" height="48" fill="none" stroke="none" stroke-width="0"/><text x="640" y="277.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">RendererInServer</text><line x1="640" y1="300" x2="640" y2="610" stroke="#DCE5EE" stroke-width="2"/><rect x="945" y="245" width="230" height="48" fill="none" stroke="none" stroke-width="0"/><text x="1060" y="277.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">引擎回调</text><line x1="1060" y1="300" x2="1060" y2="610" stroke="#DCE5EE" stroke-width="2"/><line x1="220" y1="315" x2="640" y2="315" stroke="#3379EB" stroke-width="3"/><line x1="630.9955289764732" y1="319.3496553411123" x2="640" y2="315" stroke="#3379EB" stroke-width="3"/><line x1="630.9955289764732" y1="310.6503446588877" x2="640" y2="315" stroke="#3379EB" stroke-width="3"/><rect x="230" y="282" width="405" height="30" fill="none" stroke="none" stroke-width="0"/><text x="230" y="304.875" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">Drain → I_STATUS_DRAINING</text><rect x="65" y="344" width="540" height="35" fill="none" stroke="none" stroke-width="0"/><text x="65" y="370.125" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">Drain等待超时；继续 Stop</text><line x1="220" y1="410" x2="640" y2="410" stroke="#12263B" stroke-width="3"/><line x1="630.9955289764732" y1="414.3496553411123" x2="640" y2="410" stroke="#12263B" stroke-width="3"/><line x1="630.9955289764732" y1="405.6503446588877" x2="640" y2="410" stroke="#12263B" stroke-width="3"/><rect x="230" y="377" width="405" height="30" fill="none" stroke="none" stroke-width="0"/><text x="230" y="399.5" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">Stop 请求 → I_STATUS_STOPPING</text><line x1="1060" y1="465" x2="640" y2="465" stroke="#119A92" stroke-width="3"/><line x1="649.0044710235268" y1="460.6503446588877" x2="640" y2="465" stroke="#119A92" stroke-width="3"/><line x1="649.0044710235268" y1="469.3496553411123" x2="640" y2="465" stroke="#119A92" stroke-width="3"/><rect x="650" y="432" width="405" height="30" fill="none" stroke="none" stroke-width="0"/><text x="650" y="454.5" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">OPERATION_STOPPED → STOPPED</text><line x1="1060" y1="520" x2="640" y2="520" stroke="#C97835" stroke-width="3"/><line x1="649.0044710235268" y1="515.6503446588877" x2="640" y2="520" stroke="#C97835" stroke-width="3"/><line x1="649.0044710235268" y1="524.3496553411123" x2="640" y2="520" stroke="#C97835" stroke-width="3"/><rect x="650" y="487" width="405" height="30" fill="none" stroke="none" stroke-width="0"/><text x="650" y="509.875" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">迟到的 OPERATION_DRAINED</text><rect x="653" y="555" width="562" height="60" fill="#119A92" stroke="none" stroke-width="0"/><rect x="665" y="561" width="538" height="48" fill="none" stroke="none" stroke-width="0"/><text x="934" y="591.75" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle">仅 status_ == I_STATUS_DRAINING 才恢复 STARTED</text><rect x="64" y="622" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="645" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="start">Stop 请求先进入 STOPPING；完成回调设置 STOPPED 后，迟到 Drain 不再恢复状态</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">示例为可能的并发交错；I_STATUS_属于服务端，非客户端RUNNING</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">A4</text></svg>