<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">源码设计 · 主讲</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="137" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" text-anchor="start">一次 Start，什么时候才算开始播放？</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">状态确认、数据消费与实际出声，需要分别理解</text><rect x="64" y="245" width="1100" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="275.5" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start">同一次播放，三个不同的观察点</text><rect x="64" y="310" width="342" height="65" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="76" y="316" width="318" height="53" fill="none" stroke="none" stroke-width="0"/><text x="235" y="351.125" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">调用开始</text><rect x="64" y="395" width="342" height="42" fill="none" stroke="none" stroke-width="0"/><text x="64" y="424.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="start">StartAudioStream()</text><rect x="64" y="450" width="342" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="479" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">应用请求播放</text><rect x="64" y="510" width="342" height="65" fill="none" stroke="none" stroke-width="0"/><text x="64" y="536.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">IPC 返回后</text><text x="64" y="566.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">仍等待 RUNNING</text><rect x="468" y="310" width="342" height="65" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="480" y="316" width="318" height="53" fill="none" stroke="none" stroke-width="0"/><text x="639" y="351.125" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">管理状态</text><rect x="468" y="395" width="342" height="42" fill="none" stroke="none" stroke-width="0"/><text x="468" y="424.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="start">OnOperationHandled</text><rect x="468" y="450" width="342" height="40" fill="none" stroke="none" stroke-width="0"/><text x="468" y="479" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">客户端进入 RUNNING</text><rect x="468" y="510" width="342" height="65" fill="none" stroke="none" stroke-width="0"/><text x="468" y="536.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">确认状态</text><text x="468" y="566.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">没有首帧完成屏障</text><rect x="872" y="310" width="342" height="65" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="884" y="316" width="318" height="53" fill="none" stroke="none" stroke-width="0"/><text x="1043" y="351.125" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">设备提交</text><rect x="872" y="395" width="342" height="42" fill="none" stroke="none" stroke-width="0"/><text x="872" y="424.625" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="start">RenderFrame()</text><rect x="872" y="450" width="342" height="40" fill="none" stroke="none" stroke-width="0"/><text x="872" y="479" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">引擎向设备提交数据</text><rect x="872" y="510" width="342" height="65" fill="none" stroke="none" stroke-width="0"/><text x="872" y="536.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">提交接口返回</text><text x="872" y="566.5" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">仍不等于声学出声</text><rect x="64" y="611" width="1150" height="40" fill="none" stroke="none" stroke-width="0"/><text x="64" y="640.375" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start">今天沿 Start、Pause、Move 看系统协作，再比较 PA 与自研的执行设计</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">并列观察点，不表示固定时间顺序；普通 HPAE 路径</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">01</text></svg>