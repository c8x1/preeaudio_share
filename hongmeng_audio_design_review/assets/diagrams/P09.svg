<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="64" y="30" width="1150" height="31" fill="none" stroke="none" stroke-width="0"/><text x="64" y="52.625" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start">源码设计 · 主讲</text><rect x="64" y="87" width="1150" height="70" fill="none" stroke="none" stroke-width="0"/><text x="64" y="137" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" text-anchor="start">无锁消息队列：发布、摘批与逆序执行</text><rect x="64" y="169" width="1150" height="48" fill="none" stroke="none" stroke-width="0"/><text x="64" y="203.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">常规链表头用 CAS；消费者摘批后反向遍历执行</text><rect x="65" y="255" width="450" height="40" fill="none" stroke="none" stroke-width="0"/><text x="65" y="285.125" fill="#3379EB" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">生产者：SendRequest</text><rect x="650" y="255" width="540" height="40" fill="none" stroke="none" stroke-width="0"/><text x="650" y="285.125" fill="#119A92" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start">消费者：HandleRequests</text><line x1="625" y1="255" x2="625" y2="595" stroke="#DCE5EE" stroke-width="2"/><rect x="65" y="324" width="535" height="58" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="77" y="330" width="511" height="46" fill="none" stroke="none" stroke-width="0"/><text x="332.5" y="361.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">free node 原子摘取</text><line x1="332" y1="382" x2="332" y2="401" stroke="#3379EB" stroke-width="3"/><line x1="327.6503446588877" y1="391.9955289764732" x2="332" y2="401" stroke="#3379EB" stroke-width="3"/><line x1="336.3496553411123" y1="391.9955289764732" x2="332" y2="401" stroke="#3379EB" stroke-width="3"/><rect x="65" y="401" width="535" height="58" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="77" y="407" width="511" height="46" fill="none" stroke="none" stroke-width="0"/><text x="332.5" y="438.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">填入 request lambda</text><line x1="332" y1="459" x2="332" y2="478" stroke="#3379EB" stroke-width="3"/><line x1="327.6503446588877" y1="468.9955289764732" x2="332" y2="478" stroke="#3379EB" stroke-width="3"/><line x1="336.3496553411123" y1="468.9955289764732" x2="332" y2="478" stroke="#3379EB" stroke-width="3"/><rect x="65" y="478" width="535" height="58" fill="#3379EB" stroke="none" stroke-width="0"/><rect x="77" y="484" width="511" height="46" fill="none" stroke="none" stroke-width="0"/><text x="332.5" y="515.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">CAS 发布到 requestHead</text><rect x="650" y="324" width="535" height="58" fill="#119A92" stroke="none" stroke-width="0"/><rect x="662" y="330" width="511" height="46" fill="none" stroke="none" stroke-width="0"/><text x="917.5" y="361.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">CAS 摘取整批请求</text><line x1="917" y1="382" x2="917" y2="401" stroke="#119A92" stroke-width="3"/><line x1="912.6503446588877" y1="391.9955289764732" x2="917" y2="401" stroke="#119A92" stroke-width="3"/><line x1="921.3496553411123" y1="391.9955289764732" x2="917" y2="401" stroke="#119A92" stroke-width="3"/><rect x="650" y="401" width="535" height="58" fill="#119A92" stroke="none" stroke-width="0"/><rect x="662" y="407" width="511" height="46" fill="none" stroke="none" stroke-width="0"/><text x="917.5" y="438.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">沿链读入临时数组</text><line x1="917" y1="459" x2="917" y2="478" stroke="#119A92" stroke-width="3"/><line x1="912.6503446588877" y1="468.9955289764732" x2="917" y2="478" stroke="#119A92" stroke-width="3"/><line x1="921.3496553411123" y1="468.9955289764732" x2="917" y2="478" stroke="#119A92" stroke-width="3"/><rect x="650" y="478" width="535" height="58" fill="#119A92" stroke="none" stroke-width="0"/><rect x="662" y="484" width="511" height="46" fill="none" stroke="none" stroke-width="0"/><text x="917.5" y="515.25" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">反向遍历并逐项执行</text><rect x="65" y="573" width="535" height="35" fill="none" stroke="none" stroke-width="0"/><text x="65" y="598.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">请求发布次序由CAS确定</text><rect x="650" y="573" width="540" height="35" fill="none" stroke="none" stroke-width="0"/><text x="650" y="598.75" fill="#12263B" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">摘批是原子；任务执行不是原子</text><rect x="64" y="621" width="1140" height="34" fill="none" stroke="none" stroke-width="0"/><text x="64" y="645.5" fill="#C97835" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="start">队列耗尽会扩容；扩容使用 mutex 与分配，达到上限仍无空节点会报告并丢弃请求</text><rect x="64" y="665" width="1070" height="30" fill="none" stroke="none" stroke-width="0"/><text x="64" y="686.375" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">CAS决定节点入链，批内逆序遍历恢复发布次序；慢路径有锁与分配</text><rect x="1157" y="665" width="57" height="30" fill="none" stroke="none" stroke-width="0"/><text x="1214" y="687.125" fill="#62768A" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="end">09</text></svg>